function takePhoto(){
  const v = camRoot().querySelector('.cam-video'); if (!v || !v.videoWidth || CAM.busy) return;
  CAM.busy = true;
  const sc = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight)), w = Math.round(v.videoWidth * sc), h = Math.round(v.videoHeight * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  if (CAM.facing === 'user') { x.translate(w, 0); x.scale(-1, 1); }   // selfies are saved the way you saw them
  x.drawImage(v, 0, 0, w, h);
  c.toBlob(blob => { CAM.busy = false; if (!blob) return camMsg(t('Couldn’t open the camera. Try again.')); closeCamera(); useInstantBlob(blob); }, 'image/jpeg', 0.86);
}

const UNAME_RE = /^[a-z0-9_][a-z0-9_.]{1,18}[a-z0-9_]$/;
const UNAME_RESERVED = new Set(['gomma','admin','administrator','help','support','moderator','moderators','mod','mods','official','staff','team','system','root','null','undefined','me','settings','profile','api','www','mail','email','hello','info','security','privacy','terms','abuse','report','reports','owner','founder']);
const TRANSLIT = {'ı':'i','ğ':'g','ş':'s','ç':'c','ö':'o','ü':'u','α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o'};
const normUname = v => String(v || '').trim().replace(/^@+/, '').toLowerCase();
function unameProblem(u){
  if (!UNAME_RE.test(u) || u.includes('..')) return t('Use 3–20 characters: lowercase letters, numbers, dots and underscores.');
  if (UNAME_RESERVED.has(u) || u.includes('gomma')) return t('That username isn’t available.');
  return '';
}
function suggestUsername(name){
  let s = String(name || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  s = [...s].map(ch => TRANSLIT[ch] ?? ch).join('').replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '').replace(/\.{2,}/g, '.');
  if (s.length > 20) s = s.slice(0, 20).replace(/\.+$/, '');
  if (s.length < 3) s = (s || 'member') + String(10 + Math.floor(Math.random() * 90));
  if (unameProblem(s)) s = 'member' + String(100 + Math.floor(Math.random() * 900));
  return s;
}
async function unameTaken(u){
  if (!sb) return false;
  const { data, error } = await sb.from('profiles').select('id').eq('username', u).neq('id', S.me).limit(1);
  return !error && (data || []).length > 0;
}
async function freeUsername(base){
  if (!(await unameTaken(base))) return base;
  for (let i = 0; i < 6; i++) { const c = base.slice(0, 16).replace(/\.+$/, '') + String(10 + Math.floor(Math.random() * 990)); if (!unameProblem(c) && !(await unameTaken(c))) return c; }
  return base;
}
function unameErr(e){
  const m = String((e && e.message) || '') + ' ' + String((e && e.code) || '') + ' ' + String((e && e.details) || '');
  if (/username_reserved/.test(m)) return t('That username isn’t available.');
  if (/username_recently_changed/.test(m)) return t('You can change your username once every 30 days.');
  if (/23505|duplicate|profiles_username_unique/.test(m)) return t('That username is taken.');
  if (/profiles_username_format/.test(m)) return t('Use 3–20 characters: lowercase letters, numbers, dots and underscores.');
  return '';
}
const unameLocked = p => !!(p && p.username && p.unameAt && Date.now() - p.unameAt < 30 * DAY);

async function saveUsernameGate(){
  const g = S.ug; if (!g || g.busy) return;

<p>Gomma helps people in Cyprus find activities they enjoy and other people who enjoy them too. This policy explains what information Gomma collects, why, who can see it, and the choices you have. We’ve tried to keep it short and in plain language.</p>

  if (S.offline && !S.loaded.profiles) return emptyHtml(t('Can’t reach the server'), t('Check your connection and reload the page.'));

  if (needsOnboarding()) return onboardingHtml();
  if (needsUsername()) return usernameGateHtml();
  switch (S.route.v) {
    case 'people': return peopleHtml();
    case 'create': return createHtml();
    case 'feeds': case 'feed': return feedsHtml();
    case 'profile': return profileHtml();
    case 'settings': return settingsHtml();
    case 'ads': return adsHtml();
    case 'stats': return statsHtml();
    case 'user': return userHtml(S.route.id);
    case 'notices': return noticesHtml();

function nameFit(name, box){   // a font size that lets the name sit inside a circle of this size
  const words = String(name || '').split(/\s+/).filter(Boolean), longest = Math.max(1, ...words.map(w => w.length)), total = String(name || '').length;
  let fs = Math.min(13, (box - 12) / (longest * 0.6));
  if (total > 14) fs = Math.min(fs, 11.5);
  if (total > 22) fs = Math.min(fs, 10);
  return Math.max(8.5, fs).toFixed(1);
}

  if (!ym) ym = upcoming.some(a => dayKey(a.startAt).startsWith(thisMonth)) || !upcoming.length ? thisMonth : dayKey(upcoming[0].startAt).slice(0, 7);
  let sel = S.ui.calDay;
  if (!sel || !sel.startsWith(ym)) { const n = upcoming.find(a => dayKey(a.startAt).startsWith(ym)); sel = n ? dayKey(n.startAt) : (todayKey.startsWith(ym) ? todayKey : ''); }
  const [y, m] = ym.split('-').map(Number);
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;

    cells.push(`<button class="cal-day ${k < todayKey ? 'past' : ''} ${k === todayKey ? 'today' : ''}" data-act="cal-day" data-v="${k}" aria-pressed="${k === sel}" aria-label="${label}">${d}<span class="cal-dots">${dots}</span></button>`);
  }
  const selActs = sel ? (byDay[sel] || []) : [];
  const selLabel = sel ? (sel === todayKey ? t('Today') : dayLabel(new Date(sel + 'T12:00').getTime())) : '';
  const rows = selActs.map(a => {

    <div class="cal-grid">${(LANG === 'tr' ? ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'] : LANG === 'el' ? ['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'] : ['M','T','W','T','F','S','S']).map(d => `<span class="cal-dow" aria-hidden="true">${d}</span>`).join('')}${cells.join('')}</div>
    ${none || (sel ? `<p class="cal-sel">${esc(selLabel)}</p>${rows || `<p class="cal-empty">${t('Nothing planned this day. Days with a dot have something.')}</p>`}` : `<p class="cal-empty" style="border-top:1px solid var(--line);margin-top:8px;padding-top:12px">${t('Nothing planned this month.')}</p>`)}
  </div>`;
}

  return `<div class="chat"><div class="chat-in">

      <a class="t" href="#activity-${a.id}" style="text-decoration:none"><b>${esc(a.title)}</b><span>${dayLabel(a.startAt)}, ${hm(a.startAt)}, ${t('{people} going', {people:plural(r.ids.length, 'person', 'people')})}</span></a>

    <div class="composer"><textarea class="inp" id="chat-input" rows="1" data-bind="chatDraft.${a.id}" placeholder="${t('Message the group')}" aria-label="${t('Message the group')}" maxlength="1000">${esc(val)}</textarea>
      <button class="iconbtn" data-act="send" data-id="${a.id}" aria-label="${t('Send')}">${I.send}</button></div>
  </div></div>`;
}
function chatMsgs(actId){
  const out = [];
  for (const [uid, m] of Object.entries(S.chats)) {
    if (blocked(uid)) continue;
    const arr = m && m[actId];
    if (Array.isArray(arr)) for (const x of arr) if (x && typeof x.x === 'string') out.push({uid, t:Number(x.t) || 0, x:x.x});
  }
  return out.sort((p, q) => p.t - q.t);
}
function msgsHtml(actId){
  const a = S.acts[actId]; const ms = chatMsgs(actId);
  let html = `<p class="sysmsg">${t('This chat is only for people going. Confirm plans here, and meet in public places.')}</p>`;
  if (a && a.status === 'cancelled') html += `<p class="sysmsg" style="color:var(--danger)">${t('The host cancelled this activity.')}</p>`;
  let prev = null;
  for (const m of ms) {
    const mine = m.uid === S.me;
    const grp = !prev || prev.uid !== m.uid || m.t - prev.t > 5 * MIN;
    if (grp) html += mine ? `<div class="msg-who me"><time>${hm(m.t)}</time></div>`
      : `<div class="msg-who">${av(m.uid, 20)}<span>${esc(nameOf(m.uid))}</span>${a && m.uid === a.org ? `<span class="tag tag-olive tag-xs">${t('Host')}</span>` : ''}<time>${hm(m.t)}</time></div>`;
    html += `<div class="msg ${mine ? 'me' : ''}">${esc(m.x)}</div>`;
    prev = m;
  }
  if (!ms.length) html += `<p class="sysmsg">${t('No messages yet. Say hi and let people know how to find you.')}</p>`;
  return html;
}
function renderChatMsgs(forceBottom){
  const el = $('#msgs'); if (!el || S.route.v !== 'chat') return;
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  el.innerHTML = msgsHtml(S.route.id);
  if (near || forceBottom) el.scrollTop = el.scrollHeight;
}

function connBtn(uid){
  if (!S.hasId || !S.canWrite || uid === S.me) return '';

  if (st === 'requested') return `<button class="btn btn-sm btn-ghost" data-act="unconnect" data-uid="${esc(uid)}" aria-label="${t('Cancel request')}">${t('Requested')}</button>`;
  if (st === 'incoming') return `<button class="btn btn-sm btn-join" data-act="connect" data-uid="${esc(uid)}">${t('Accept')}</button>`;
  return `<button class="btn btn-sm btn-primary" data-act="connect" data-uid="${esc(uid)}">${t('Connect')}</button>`;

function feedPicker(k, current){

    <select class="inp" data-pick-feed="${k}" style="margin-top:10px" aria-label="${t('Choose another feed')}"><option value="">${t('Another feed…')}</option>${CATS.map(c => `<optgroup label="${t(c.name)}">${FEEDS.filter(f => f.cat === c.id && !list.includes(f.slug)).map(f => `<option value="${f.slug}">${esc(t(f.name))}</option>`).join('')}</optgroup>`).join('')}</select>${reqLine()}`;
}
function createHtml(){

  const d = S.draft || (S.draft = newDraft());
  const comms = myComms();
  const startAt = cyToMs(d.date, d.time);
  const kind = startAt && startAt - Date.now() <= 6 * HOUR ? t('Spontaneous: {when}', {when:relStart(startAt).toLocaleLowerCase(LOC())}) : startAt ? t('Scheduled: {day} at {time}', {day:dayLabel(startAt), time:d.time}) : '';

    <div class="field"><span class="lbl">${t('Which feed is it for?')}</span>${feedPicker('draft', d.feed)}<p class="hint">${t('It shows up in that feed, so people who follow it see it first.')}</p></div>
    <div class="field"><span class="lbl">${t('When')}</span>
      <div class="chipwrap" style="margin-bottom:10px">${P('hour', t('In about an hour'))}${P('evening', eveningLabel())}${P('weekend', t('Saturday morning'))}</div>
      <div class="row2"><input class="inp" type="date" id="c-date" data-bind="draft.date" data-rerender value="${esc(d.date)}" min="${ymd(new Date())}" aria-label="${t('Date')}"><input class="inp" type="time" id="c-time" data-bind="draft.time" data-rerender value="${esc(d.time)}" aria-label="${t('Start time')}"></div>
      ${kind ? `<p class="hint">${esc(kind)}</p>` : ''}${cyDiffers() ? `<p class="hint">${t('Times are in Cyprus time.')}</p>` : ''}</div>
    <div class="field"><span class="lbl">${t('How long')}</span><div class="chipwrap">${[30, 60, 120, 180, 240].map(v => [v, durLabel(v)]).map(([v, l]) => `<button class="chip" data-act="dur" data-v="${v}" aria-pressed="${Number(d.dur) === v}">${l}</button>`).join('')}</div></div>
    <div class="field"><label class="lbl" for="c-area">${t('Area')}</label><select class="inp" id="c-area" data-bind="draft.area">${areaOptions(d.area)}</select></div>
    <div class="field"><label class="lbl" for="c-spot">${t('Public meeting spot')}</label><input class="inp" id="c-spot" data-bind="draft.spot" value="${esc(d.spot)}" maxlength="120" placeholder="${t('Near the Othello Castle entrance')}"><p class="hint">${t('Everyone can see this. Choose a public, easy-to-find place.')}</p></div>
    <div class="field"><label class="lbl" for="c-exact">${t('Exact meeting point')} <span class="muted">${t('(optional)')}</span></label><textarea class="inp" id="c-exact" data-bind="draft.exact" maxlength="400" placeholder="${t('By the blue bench next to the café. I’ll be wearing a yellow cap.')}">${esc(d.exact)}</textarea><p class="hint">${t('Only people who join can see this.')}</p></div>
    <div class="field"><span class="lbl">${t('Cost')}</span><div class="seg" role="group"><button data-act="free" data-v="1" aria-pressed="${!!d.free}">${t('Free')}</button><button data-act="free" data-v="0" aria-pressed="${!d.free}">${t('Paid')}</button></div>
      ${d.free ? '' : `<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="seg" role="group" aria-label="${t('Currency')}"><button data-act="cur" data-v="EUR" aria-pressed="${d.cur !== 'TRY'}">€ Euro</button><button data-act="cur" data-v="TRY" aria-pressed="${d.cur === 'TRY'}">₺ Lira</button></div><input class="inp" id="c-price" data-bind="draft.price" value="${esc(d.price)}" inputmode="decimal" placeholder="${d.cur === 'TRY' ? '350' : '10'}" style="max-width:130px" aria-label="${d.cur === 'TRY' ? t('Price in Turkish lira') : t('Price in euros')}"></div><p class="hint">${t('People pay you in person. In-app payments aren’t available yet.')}</p>`}</div>
    <div class="field"><span class="lbl">${t('How many people')}</span><div class="stepper"><button data-act="cap" data-v="-1" aria-label="${t('Fewer people')}">−</button><b aria-live="polite">${d.cap}</b><button data-act="cap" data-v="1" aria-label="${t('More people')}">+</button><span class="muted">${t('including you')}</span></div></div>
    <div class="field"><span class="lbl">${t('Who can see it')}</span><div class="seg" role="group">

      <button data-act="vis" data-v="connections" aria-pressed="${d.vis === 'connections'}">${t('Connections')}</button>

    <div class="field"><label class="lbl" for="c-desc">${t('Anything else people should know?')} <span class="muted">${t('(optional)')}</span></label><textarea class="inp" id="c-desc" data-bind="draft.desc" maxlength="1500" placeholder="${t('Relaxed pace, about 5 km. Bring water.')}">${esc(d.desc)}</textarea></div>
    <div class="field"><span class="lbl">${t('Photo')} <span class="muted">${t('(optional)')}</span></span>${actPhotoPicker('draft', {preview:d.photoPreview, has:!!d.photoPreview})}<p class="hint">${t('A picture of the place helps people imagine it, like the mountain for a hike.')}</p></div>
    ${d.err ? `<p class="err" role="alert">${esc(d.err)}</p>` : ''}
    <button class="btn btn-join btn-wide" style="margin-top:24px" data-act="publish" ${d.busy ? 'disabled' : ''}>${d.busy ? t('Publishing…') : t('Publish activity')}</button>`;
}

/* profile */
function profileHtml(){
  if (!S.hasId || !myProfile()) return `<h1 class="h1" style="margin-top:14px">${t('Profile')}</h1>${accessBanner()}${emptyHtml(t('No profile yet'), S.canWrite ? t('Set up your profile to join activities.') : t('Your current access lets you browse without a profile.'))}`;
  const p = myProfile();
  const all = Object.values(S.acts);
  const mineAll = all.filter(a => inRoster(a) && a.status !== 'cancelled');
  const upcoming = mineAll.filter(isOpen).sort((x, y) => x.startAt - y.startAt);
  const hosting = upcoming.filter(a => a.org === S.me);
  const past = mineAll.filter(a => phase(a) === 'past').sort((x, y) => y.startAt - x.startAt);
  const tab = S.ui.ptab || 'upcoming', lists = {upcoming, hosting, past};
  const shown = tab === 'past' ? past.slice(0, S.ui.pastN || 15) : lists[tab];
  const tabBtn = (v, label, n) => `<button data-act="ptab" data-v="${v}" aria-pressed="${tab === v}">${label}<span class="pt-n">${n}</span></button>`;
  const empty = {
    upcoming:`<div class="pt-empty"><p>${t('Nothing planned yet.')}</p><div class="pt-empty-acts"><a class="btn btn-primary btn-sm" href="#discover">${t('Find something to do')}</a><a class="btn btn-ghost btn-sm" href="#create">${t('Post an activity')}</a></div></div>`,
    hosting:`<div class="pt-empty"><p>${t('You’re not hosting anything right now.')}</p><div class="pt-empty-acts"><a class="btn btn-primary btn-sm" href="#create">${t('Post an activity')}</a></div></div>`,
    past:`<div class="pt-empty"><p>${t('Activities you’ve been to will appear here.')}</p></div>`};
  const saved = (S.prefs.saved || []).map(id => S.acts[id]).filter(a => a && canSee(a) && isOpen(a));
  const comms = myComms();
  const conns = Object.keys(S.profiles).filter(u => u !== S.me && isConnected(u) && !blocked(u));
  const organized = all.filter(a => a.org === S.me && a.status !== 'cancelled').length;
  const since = p.joinedAt ? new Date(p.joinedAt).toLocaleDateString(LOC(), {month:'long', year:'numeric'}) : '';
  const missing = [!p.photo && t('Add a photo'), !p.bio && t('Write a short bio'), !p.age && t('Add your age')].filter(Boolean);
  const strength = Math.round(100 * (5 - missing.length) / 5);
  return `<div class="topbar"><h1 class="h1" style="margin-top:8px">${t('Profile')}</h1><a class="iconbtn" href="#settings" aria-label="${t('Settings')}">${I.gear}</a></div>
    ${accessBanner()}
    <section class="pro-card">
      <div class="pro-top"><div class="pro-av">${av(S.me, 96)}</div><div class="pro-id">
        <h2 class="pro-name">${esc(p.name)}${S.canEdit ? `<span class="pro-badge">${t('Moderator')}</span>` : ''}</h2>${p.username ? `<p class="pro-user">@${esc(p.username)}</p>` : ''}
        <p class="pro-meta">${I.pin}<span>${areaName(p.area)}${p.age && p.showAge ? ` · ${p.age}` : ''}</span></p>
        ${since ? `<p class="pro-since">${t('Member since {date}', {date:since})}</p>` : ''}
      </div></div>
      ${p.bio ? `<p class="pro-bio">${esc(p.bio)}</p>` : ''}
      <div class="pro-actions"><a class="btn btn-primary btn-sm" href="#edit-profile">${t('Edit profile')}</a></div>
    </section>
    <div class="pro-stats"><div><b>${past.length}</b><span>${t('Been to')}</span></div><div><b>${organized}</b><span>${t('Hosted')}</span></div><div><b>${conns.length}</b><span>${t('Connections')}</span></div></div>
    ${missing.length ? `<div class="pro-nudge"><div class="pro-nudge-top"><b>${t('Your profile is {n}% complete', {n:strength})}</b><a href="#edit-profile">${t('Finish it')}</a></div><div class="pro-bar"><i style="width:${strength}%"></i></div><p>${missing.join(' · ')}</p></div>` : ''}
    <h2 class="sec">${t('Interests')} <small><button class="linkbtn" data-act="manage-interests">${t('Manage')}</button></small></h2>
    <p class="pro-ints">${(S.ui.intAll ? myFeeds() : myFeeds().slice(0, 8)).map(f => `<a href="#feed-${f.slug}">${esc(t(f.name))}</a>`).join('<span class="dot" aria-hidden="true"> · </span>')}${myFeeds().length > 8 && !S.ui.intAll ? ` <button class="linkbtn pro-more" data-act="int-all">${t('+{n} more', {n:myFeeds().length - 8})}</button>` : ''}</p>
    ${(() => { const pp = photoPosts(S.me); return `<h2 class="sec">${t('Posts')}${pp.length ? ` <small>${pp.length}</small>` : ''}</h2>${pp.length ? postGrid(pp) : `<p class="empty-line">${t('Photo posts you share will appear here.')}</p>`}`; })()}
    <h2 class="sec">${t('Your activities')}</h2>
    <div class="seg pt-tabs">${tabBtn('upcoming', t('Upcoming'), upcoming.length)}${tabBtn('hosting', t('Hosting'), hosting.length)}${tabBtn('past', t('Past'), past.length)}</div>
    ${shown.length ? `<div class="list">${shown.map(a => actRow(a)).join('')}</div>${tab === 'past' && past.length > shown.length ? `<button class="btn btn-ghost btn-wide" data-act="past-more" style="margin-top:10px">${t('Show more')}</button>` : ''}` : empty[tab]}
    ${saved.length ? `<h2 class="sec">${t('Saved for later')}</h2><div class="list">${saved.map(a => actRow(a)).join('')}</div>` : ''}
    <h2 class="sec">${t('Your clubs')}${S.canWrite ? ` <small><button class="linkbtn" data-act="start-club">${t('Start a club')}</button></small>` : ''}</h2>
    ${comms.length ? `<div class="list">${comms.map(commRow).join('')}</div>` : `<p class="empty-line"><a href="#feeds">${t('Find a club')}</a> ${t('through your feeds.')}</p>`}
    ${(() => { const sug = clubSuggestions(); return sug.length ? dockSection('clubs', t('Clubs you might like'), sug.map(c => `<a class="dock-item cb-item" role="listitem" href="#club-${c.id}" title="${esc(c.name)}">${clubBubble(c)}</a>`).join(''), sug.slice(0, 5).map(c => clubLogo(c)).join('')) : ''; })()}
`;
}
function settingsHtml(){
  const reportCount = Object.values(S.reports).reduce((n, d) => n + ((d && d.items) || []).length, 0);
  const row = (icon, label, val, attrs, cls) => `<button class="set-row${cls ? ' ' + cls : ''}" ${attrs}><span class="set-ico">${icon}</span><span class="set-lbl">${label}</span>${val != null ? `<span class="set-val">${val}</span>` : ''}<span class="set-chev">${I.fwd}</span></button>`;

    ${group(t('Safety'), [row(I.shield, t('Meetup safety tips'), null, 'data-act="safety"'), row(I.user, t('Preview my profile'), null, `data-act="person" data-uid="${esc(S.me)}"`), row(I.block, t('Blocked people'), (S.prefs.blocked || []).length, 'data-act="blocked"')].concat(S.canEdit ? [row(I.flag, t('Reports from members'), reportCount, 'data-act="reports"'), row(I.ad, t('Ads'), (S.ads || []).filter(adLive).length, 'data-act="nav" data-go="#ads"'), row(I.chart, t('App stats'), null, 'data-act="nav" data-go="#stats"'), row(I.bell, t('Announcements'), (S.notices || []).filter(liveNotice).length, 'data-act="nav" data-go="#notices"')] : []))}
    ${group(t('Legal'), [row(I.doc, t('Terms and Conditions'), null, 'data-act="open-legal" data-v="terms"'), row(I.lock, t('Privacy Policy'), null, 'data-act="open-legal" data-v="privacy"')])}
    ${group(t('Account'), [row(I.logout, t('Sign out'), esc(S.email || ''), 'data-act="sign-out"'), row(I.trash, t('Delete my account'), null, 'data-act="delete-account"', 'danger')])}
    <p class="hint" style="margin-top:22px">${t('Exact meeting points are only shown to people who join. Your age is only shown if you choose to show it.')}</p>`;
}

/* ---------- sheets ---------- */
function openSheet(s){ S.sheet = {...s, _new:true}; render(); }
function sheetHtml(){
  const s = S.sheet; if (!s) return '';
  let body = '';
  if (s.type === 'person') body = personSheet(s.uid);
  else if (s.type === 'confirm') body = `<h2 class="h2">${esc(s.title)}</h2><p class="sub" style="margin-top:10px">${esc(s.body)}</p><div class="sheet-actions"><button class="btn ${s.danger ? 'btn-danger' : 'btn-primary'}" data-act="confirm-yes">${esc(s.cta)}</button><button class="btn btn-ghost" data-act="close">${t('Keep it')}</button></div>`;
  else if (s.type === 'report') body = `<h2 class="h2">${esc(s.label)}</h2><p class="sub" style="margin-top:8px">${t('Reports go to the app’s moderators. The person you report isn’t told who reported them.')}</p>
    ${REASONS.map(r => `<button class="opt" data-act="reason" data-v="${esc(r)}" aria-pressed="${s.reason === r}">${esc(t(r))}</button>`).join('')}
    <div class="field"><label class="lbl" for="rep-note">${t('What happened?')} <span class="muted">${t('(optional)')}</span></label><textarea class="inp" id="rep-note" data-bind="sheet.note" maxlength="600">${esc(s.note || '')}</textarea></div>
    ${s.err ? `<p class="err" role="alert">${esc(s.err)}</p>` : ''}
    <div class="sheet-actions"><button class="btn btn-danger" data-act="send-report">${t('Send report')}</button><button class="btn btn-ghost" data-act="close">${t('Cancel')}</button></div>`;
  else if (s.type === 'notifs') body = notifsSheet(s.seen || 0);
  else if (s.type === 'invite') body = inviteSheet(s);

function isTyping(){ const el = document.activeElement; if (!el || el.dataset.live !== undefined) return false; return el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['checkbox','radio','button','date','time'].includes(el.type)); }

/* ---------- routing ---------- */
function parseRoute(){
  const h = (location.hash || '').slice(1);
  if (['discover','people','create','feeds','profile','new-club','edit-profile','terms','privacy','settings','ads','stats','notices'].includes(h)) return {v:h};
  if (h === 'groups') return {v:'feeds'};
  let m;
  if ((m = h.match(/^activity-([a-z0-9-]+)$/))) return {v:'activity', id:m[1]};
  if ((m = h.match(/^chat-([a-z0-9-]+)$/))) return {v:'chat', id:m[1]};
  if ((m = h.match(/^(?:club|group)-([a-z0-9-]+)$/))) return {v:'club', id:m[1]};
  if ((m = h.match(/^feed-([a-z0-9-]+)$/))) return {v:'feed', id:m[1]};
  if ((m = h.match(/^u-([a-z0-9-]+)$/))) return {v:'user', id:m[1]};
  return {v:'discover'};
}
function route(){
  const r = parseRoute(), h = location.hash || '#discover';
  if (r.v === 'feed' && FEED[r.id]) S.ui.feed = r.id;
  if (r.v === 'feed' || r.v === 'feeds') S.centerStory = true;
  if (TABS.includes(r.v) || r.v === 'feed') { S.stack = [h]; S.lastTab = r.v === 'feed' ? 'feeds' : r.v; }
  else { const st = S.stack; if (st.length > 1 && st[st.length - 2] === h) st.pop(); else if (st[st.length - 1] !== h) st.push(h); }
  if (r.v === 'edit-profile') S.pedit = profileDraft();
  if (r.v === 'discover' && S.route.v !== 'discover') S.tlDone = false;
  S.route = r; S.sheet = null;
  render();
  window.scrollTo(0, 0);
}
function goBack(){ const st = S.stack; location.hash = st.length > 1 ? st[st.length - 2] : '#' + S.lastTab; }
window.addEventListener('hashchange', route);

  'delete-comm': el => { const id = el.dataset.id; openSheet({type:'confirm', title:t('Delete this club?'), body:t('Its page and announcements are removed for everyone. Activities already posted stay up.'), cta:t('Delete club'), danger:true, fn:() => deleteComm(id)}); },
  'g-emoji': el => { S.gdraft.emoji = el.dataset.v; S.gdraft.custom = true; render(); },
  'g-color': el => { S.gdraft.color = el.dataset.v; S.gdraft.custom = true; render(); },
  'g-cat': el => { S.gdraft.cat = el.dataset.v; render(); },
  'create-comm': () => createCommunity(),
  'toggle-interest': el => { const d = el.dataset.k === 'ob' ? S.ob : S.pedit; const v = el.dataset.v; d.interests = d.interests.includes(v) ? d.interests.filter(x => x !== v) : [...d.interests, v]; d.err = ''; render(); },
  'pick-area': el => { const d = el.dataset.k === 'ob' ? S.ob : S.pedit; d.area = el.dataset.v; d.err = ''; render(); },
  'ob-next': async () => {
    const o = S.ob; o.err = '';
    if (o.step === 1) {
      if (!String(o.name).trim()) { o.err = t('Add the name people will see.'); return render(); }
      const n = o.age === '' ? null : parseInt(o.age, 10);
      if (o.age !== '' && (isNaN(n) || n < 18 || n > 99)) { o.err = t('Enter an age between 18 and 99, or leave it blank.'); return render(); }
      if (!o.adult) { o.err = t('Please confirm that you’re 18 or older to continue.'); return render(); }
      o.username = normUname(o.username);
      const pr = unameProblem(o.username); if (pr) { o.err = pr; return render(); }
      if (await unameTaken(o.username)) { if (o.uTouched) { o.err = t('That username is taken.'); return render(); } o.username = await freeUsername(o.username); }
    }
    if (o.step === 2 && o.interests.length < 3) { o.err = t('Pick at least 3 interests.'); return render(); }
    o.step++; render(); window.scrollTo(0, 0);
  },
  'ob-prev': () => { S.ob.step = Math.max(0, S.ob.step - 1); S.ob.err = ''; render(); },
  'ob-finish': async () => { const ok = await saveProfileDraft(S.ob, true); if (ok) { const pb = S.ob && S.ob.photoBlob, pv = S.ob && S.ob.photoPreview; S.ob = null; location.hash = '#discover'; render(); if (pb) await setMyPhoto(pb, true); if (pv) URL.revokeObjectURL(pv); } },
  'save-profile': async () => { const ok = await saveProfileDraft(S.pedit, false); if (ok) goBack(); },
  'pick-feed': el => { setFeed(el.dataset.k, el.dataset.v); render(); },
  'follow-feed': el => followFeed(el.dataset.v, true),
  'unfollow-feed': el => followFeed(el.dataset.v, false),
  'plan-feed': el => { const f = FEED[el.dataset.v]; S.draft = newDraft(f ? {feed:f.slug, cat:f.cat} : {}); location.hash = '#create'; },
  'start-club': el => { S.gdraft = newGDraft(el.dataset.feed); location.hash = '#new-club'; },
  'cal-day': el => { S.ui.calDay = el.dataset.v; render(); },
  'cal-month': el => {
    const base = S.ui.calMonth ? new Date(S.ui.calMonth + '-01T12:00') : (() => { const ce = document.querySelector('.cal-day[data-v]'); return ce ? new Date(ce.dataset.v.slice(0, 7) + '-01T12:00') : new Date(); })();
    base.setMonth(base.getMonth() + Number(el.dataset.v));
    S.ui.calMonth = ymd(base).slice(0, 7); S.ui.calDay = ''; render();
  },
  'switch-feed': el => { const l = feedStrip(), i = l.indexOf(currentFeed()), j = l.indexOf(el.dataset.v); switchFeed(el.dataset.v, j > i ? 1 : j < i ? -1 : 0); },
  compose: () => openSheet({type:'compose', feed:currentFeed(), text:''}),
  'compose-feed': el => { S.sheet.feed = el.dataset.v; render(); },
  'send-post': async () => {
    const sh = S.sheet; if (!sh) return;
    if (!String(sh.text || '').trim() && !sh.blob) { sh.err = t('Write something or add a photo.'); render(); return; }
    sh.busy = true; sh.err = ''; render();
    const ok = await postToFeed(sh.feed, sh.text, sh.blob);
    if (ok && sh.preview) URL.revokeObjectURL(sh.preview);
    if (ok) { if (S.route.v === 'feed' || S.route.v === 'feeds') switchFeed(sh.feed, 0); else { S.sheet = null; render(); } }
    else if (S.sheet) { S.sheet.busy = false; render(); }
  },
  explore: () => openSheet({type:'explore', q:''}),
  'manage-interests': () => openSheet({type:'explore', q:'', mode:'interests'}),
  'toggle-feed': async el => {
    const sl = el.dataset.v;
    if (!(S.canWrite && S.hasId && myProfile())) { switchFeed(sl, 0); return; }
    if (followsFeed(sl) && myFeeds().length <= 1) { toast(t('Follow at least one feed.')); return; }
    await followFeed(sl, !followsFeed(sl));
  },
  like: el => toggleLike(el.dataset.id),
  thread: el => { markPostSeen(el.dataset.id); openSheet({type:'thread', id:el.dataset.id, text:''}); },
  reply: el => replyTo(el.dataset.id),
  'post-more': el => openSheet({type:'post-more', id:el.dataset.id}),
  'del-post': el => deletePost(el.dataset.id, true),
  'del-post-confirm': el => { const id = el.dataset.id; openSheet({type:'confirm', title:t('Delete this post?'), body:t('It’s removed from the feed along with your replies to it.'), cta:t('Delete post'), danger:true, fn:() => deletePost(id)}); },
  'plan-post': el => { const po = S.posts[el.dataset.id]; if (!po) return; const f = FEED[po.f]; const mine = po.by === S.me; S.draft = newDraft({...(f && !f.general ? {feed:po.f, cat:f.cat} : {}), ...(mine ? {title:po.x.split('\n')[0].slice(0, 80), desc:po.x.slice(0, 1500)} : {})}); location.hash = '#create'; },
  'auth-send': async () => {
    const a = S.auth, em = String(a.email || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { a.err = t('Enter a valid email address.'); render(); return; }
    a.busy = true; a.err = ''; render();
    const { error } = await sb.auth.signInWithOtp({email:em, options:{emailRedirectTo:location.origin + location.pathname}});
    a.busy = false;
    if (error) { console.warn(error); a.err = t('We couldn’t send the email. Wait a minute and try again.'); }
    else { a.step = 'code'; a.email = em; a.code = ''; }
    render();
  },
  'auth-verify': async () => {
    const a = S.auth, code = String(a.code || '').replace(/\s/g, '');
    if (!code) return;
    a.busy = true; a.err = ''; render();
    const { error } = await sb.auth.verifyOtp({email:a.email, token:code, type:'email'});
    if (error) { a.busy = false; a.err = t('That code didn’t work. Check it and try again, or request a new link.'); render(); }
  },
  'auth-back': () => { S.auth = {step:'email', email:(S.auth && S.auth.email) || '', code:'', err:'', busy:false}; render(); },
  'auth-oauth': async el => { await sb.auth.signInWithOAuth({provider:el.dataset.v, options:{redirectTo:location.origin + location.pathname}}); },
  'sign-out': async () => { await sb.auth.signOut(); toast(t('Signed out.')); },
  'delete-account': () => openSheet({type:'confirm', title:t('Delete your account?'), body:t('Your profile, posts, messages and activities are deleted for good. This can’t be undone.'), cta:t('Delete account'), danger:true,
    fn: async () => { const ph = (myProfile() || {}).photo; if (ph) { try { await sb.storage.from('avatars').remove([ph]); } catch (e) {} } for (const bucket of ['activity-photos', 'instants']) { try { const { data:own } = await sb.storage.from(bucket).list(S.me, {limit:1000}); if (own && own.length) await sb.storage.from(bucket).remove(own.map(f => S.me + '/' + f.name)); } catch (e) {} } const { error } = await sb.rpc('delete_my_account'); if (error) { writeErr(error); return; } await sb.auth.signOut(); toast(t('Your account was deleted.')); }}),
  lang: el => { const l = el.dataset.v; if (!l) { openSheet({type:'lang'}); return; } LANG = l; lsSet('fyp-lang', l); document.documentElement.lang = l; S.sheet = null; render(); },
  theme: el => { const v = el.dataset.v; if (!v) { openSheet({type:'theme'}); return; } if (v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v; lsSet('fyp-theme', v); S.sheet = null; render(); },
  safety: el => openSheet({type:'safety', area:el.dataset.area || '', ctx:el.dataset.area ? 'act' : 'me'}),
  cur: el => { S.draft.cur = el.dataset.v; S.draft.curSet = true; render(); },
  blocked: () => openSheet({type:'blocked'}),
  reports: () => openSheet({type:'reports'}),
};
let lastTap = {id:null, t:0};
document.addEventListener('click', e => {
  const m = e.target.closest && e.target.closest('[data-dbl-like]');
  if (m) {
    const id = m.dataset.dblLike, now = Date.now();
    if (lastTap.id === id && now - lastTap.t < 350) {
      lastTap = {id:null, t:0};
      heartPop(e.clientX, e.clientY);
      if (!iLiked(id) && S.canWrite && S.hasId && myProfile()) toggleLike(id);
    } else lastTap = {id, t:now};
    return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'scrim' && e.target !== el) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target, b = el.dataset.bind; if (!b) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  const parts = b.split('.'); let o = S;
  for (let i = 0; i < parts.length - 1; i++) { o = o[parts[i]]; if (!o) return; }
  o[parts[parts.length - 1]] = v;
  if (b === 'ob.adult' && v && S.ob && S.ob.err) { S.ob.err = ''; const er = document.querySelector('main .err'); if (er) er.remove(); }   // confirmed: clear the reminder
  if (el.id === 'chat-input') { el.style.height = 'auto'; el.style.height = Math.min(120, el.scrollHeight) + 'px'; }
  if (el.dataset.live !== undefined && !e.isComposing) { clearTimeout(liveT); liveT = setTimeout(render, 140); }
});
let liveT;
document.addEventListener('change', async e => {
  const el = e.target;
  if (!el.matches || !el.matches('input[type=file][data-photo]')) return;
  const file = el.files && el.files[0]; const kind = el.dataset.photo; el.value = '';
  if (!file) return;
  let blob;
  try { blob = await photoBlob(file, kind === 'draft' || kind === 'act' || kind === 'instant' || kind === 'ad' || kind === 'post'); } catch (err) { toast(t('That photo couldn’t be used. Try a JPG or PNG.')); return; }
  if (kind === 'ob') { if (!S.ob) return; if (S.ob.photoPreview) URL.revokeObjectURL(S.ob.photoPreview); S.ob.photoBlob = blob; S.ob.photoPreview = URL.createObjectURL(blob); render(); }
  else if (kind === 'draft') { if (!S.draft) return; if (S.draft.photoPreview) URL.revokeObjectURL(S.draft.photoPreview); S.draft.photoBlob = blob; S.draft.photoPreview = URL.createObjectURL(blob); render(); }
  else if (kind === 'act') await setActPhoto(el.dataset.id, blob);
  else if (kind === 'club') await setClubLogo(el.dataset.id, blob);
  else if (kind === 'post') { const sh = S.sheet; if (!sh || sh.type !== 'compose') return; if (sh.preview) URL.revokeObjectURL(sh.preview); sh.blob = blob; sh.preview = URL.createObjectURL(blob); sh.err = ''; render(); }
  else if (kind === 'ad') { const sh = S.sheet; if (!sh || sh.type !== 'ad-edit') return; if (sh.preview) URL.revokeObjectURL(sh.preview); sh.blob = blob; sh.preview = URL.createObjectURL(blob); render(); }
  else if (kind === 'instant') useInstantBlob(blob);
  else await setMyPhoto(blob);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'area-sel') { S.ui.area = el.value; render(); return; }
  if (el.dataset.pickFeed) { if (el.value) { setFeed(el.dataset.pickFeed, el.value); render(); } return; }
  if (el.dataset.bind) {
    const v = el.type === 'checkbox' ? el.checked : el.value;
    const parts = el.dataset.bind.split('.'); let o = S;
    for (let i = 0; i < parts.length - 1; i++) { o = o[parts[i]]; if (!o) return; }
    o[parts[parts.length - 1]] = v;
    if (el.dataset.bind === 'draft.date' || el.dataset.bind === 'draft.time') S.draft.preset = '';
    if (el.dataset.bind === 'draft.area' && S.draft && !S.draft.curSet) S.draft.cur = defaultCur(S.draft.area);
    if (el.tagName === 'SELECT' || el.dataset.rerender !== undefined) render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
  if (e.key === 'Enter' && e.target.id === 'au-email') { e.preventDefault(); ACT['auth-send'](); }
  if (e.key === 'Enter' && e.target.id === 'au-code') { e.preventDefault(); ACT['auth-verify'](); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-input' && !e.isComposing) { e.preventDefault(); sendMsg(S.route.id); }
});
/* swipe between feeds */
let sw = null;
function feedNeighbour(dir){ const l = feedStrip(), i = l.indexOf(currentFeed()); return l[i + dir]; }
function resetStage(el){ if (!el) return; el.style.transition = 'transform .2s ease, opacity .2s ease'; el.style.transform = ''; el.style.opacity = ''; }
document.addEventListener('touchstart', e => {
  const st = e.target.closest && e.target.closest('#feed-stage');
  if (!st || e.touches.length !== 1 || S.sheet || e.target.closest('.hscroll')) { sw = null; return; }
  sw = {x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, lock:null, el:st, t:Date.now()};
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!sw) return;
  const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (!sw.lock) { if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; sw.lock = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'x' : 'y'; }
  if (sw.lock !== 'x') return;
  e.preventDefault();
  sw.dx = dx;
  const edge = !feedNeighbour(dx < 0 ? 1 : -1);
  sw.el.style.transition = 'none';
  sw.el.style.transform = `translateX(${edge ? dx * 0.25 : dx}px)`;
  sw.el.style.opacity = String(1 - Math.min(0.4, Math.abs(dx) / 800));
}, {passive:false});
function endSwipe(){
  if (!sw) return;
  const s = sw; sw = null;
  if (s.lock !== 'x') return;
  const dir = s.dx < 0 ? 1 : -1, target = feedNeighbour(dir);
  const fast = Math.abs(s.dx) / Math.max(1, Date.now() - s.t) > 0.5;
  if (target && (Math.abs(s.dx) > 70 || (fast && Math.abs(s.dx) > 30))) { lsSet('fyp-swiped', '1'); switchFeed(target, dir); }
  else resetStage(s.el);
}
document.addEventListener('touchend', endSwipe);
document.addEventListener('touchcancel', endSwipe);
let wheelAcc = 0, wheelLock = 0;
document.addEventListener('wheel', e => {
  if (!e.target.closest || !e.target.closest('#feed-stage') || e.target.closest('.hscroll') || S.sheet) return;
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  if (Date.now() < wheelLock) return;
  wheelAcc += e.deltaX;
  if (Math.abs(wheelAcc) > 90) { const dir = wheelAcc > 0 ? 1 : -1, nb = feedNeighbour(dir); wheelAcc = 0; wheelLock = Date.now() + 700; if (nb) { lsSet('fyp-swiped', '1'); switchFeed(nb, dir); } }
}, {passive:false});
document.addEventListener('keydown', e => {
  if ((S.route.v !== 'feed' && S.route.v !== 'feeds') || S.sheet || isTyping() || !['ArrowLeft','ArrowRight'].includes(e.key)) return;
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  const dir = e.key === 'ArrowRight' ? 1 : -1, nb = feedNeighbour(dir);
  if (nb) { e.preventDefault(); switchFeed(nb, dir); }
});

let toastT;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3400); }
setInterval(() => { if (!S.sheet && !isTyping() && S.route.v !== 'chat') schedule(); }, 60000);

/* ---------- boot & sign-in ---------- */
function resetData(){
  for (const k of Object.keys(R)) R[k] = Array.isArray(R[k]) ? [] : (k === 'mod' ? false : null);
  Object.assign(S, {profiles:{}, acts:{}, rosters:{}, comms:{}, members:{}, posts:{}, likes:{}, chats:{}, reports:{}, prefs:{saved:[], blocked:[], seenAt:0},
    loaded:{profiles:false, acts:false}, ob:null, draft:null, gdraft:null, sheet:null, offline:false, canEdit:false, isOwner:false});
}
let sessionUid = null;
async function useSession(session){
  const uid = (session && session.user && session.user.id) || '';
  if (uid === sessionUid) return;
  sessionUid = uid;
  stopListening(); resetData();
  if (!uid) { S.me = ''; S.hasId = false; S.email = ''; render(); return; }
  Object.assign(S, {me:uid, hasId:true, canWrite:true, writeKnown:true, email:session.user.email || '', auth:null});
  render();
  try { await loadAll(); listen(); } catch (e) { console.warn(e); S.offline = true; }
  render();
}
async function boot(){
  if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#discover');
  S.route = parseRoute(); S.stack = [location.hash]; if (TABS.includes(S.route.v)) S.lastTab = S.route.v;
  if (S.route.v === 'feed') { S.ui.feed = S.route.id; S.lastTab = 'feeds'; S.centerStory = true; }
  render();
  if (!sb) { S.setup = true; S.booted = true; render(); return; }
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => useSession(session), 0); });
  try {
    const { data } = await sb.auth.getSession();
    if (/[?&](code|error)=/.test(location.search) || /(access_token|error_description|error)=/.test(BOOT_URL)) { history.replaceState(null, '', location.pathname + '#discover'); S.route = parseRoute(); S.stack = ['#discover']; }
    if (/[?&#]error(_code|_description)?=/.test(BOOT_URL) && !(data && data.session)) S.auth = {step:'email', email:'', code:'', err:t('That sign-in link has expired or was already used. Enter your email to get a new one.'), busy:false};
    S.booted = true;
    await useSession(data && data.session);
  } catch (e) { console.warn(e); S.booted = true; S.offline = true; }
  render();
}
boot();
</script>
