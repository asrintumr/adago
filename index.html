<style>
:root{
  color-scheme: light;
  --bg:#DDE3D5; --surface:#F4F6F0; --surface-2:#E7ECE1; --line:#C3CDB8;
  --ink:#1F2A22; --ink-2:#3A4A3E; --ink-3:#536151;
  --olive:#08707D; --olive-ink:#FFFFFF; --olive-soft:#CFE8E6;
  --copper:#B83D0B; --copper-ink:#FFFFFF; --copper-soft:#FCE6D9;
  --sea:#2D5A47; --danger:#A8321F; --danger-soft:#FDE2DF;
  --tang:#F28C28; --sun:#FFC93C;
  --copper-text:#9A3412; --olive-text:#065F6A;
  --shadow:0 6px 24px rgba(40,56,40,.10);
  --font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-head:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1A22; --surface:#15252F; --surface-2:#1D3140; --line:#2A4152;
    --ink:#EEF7F8; --ink-2:#BCD0D6; --ink-3:#8AA2AB;
    --olive:#45D3DB; --olive-ink:#062026; --olive-soft:#123A42;
    --copper:#F28C28; --copper-ink:#2A1103; --copper-soft:#3D2414;
    --sea:#7CC4FF; --danger:#FF8A80; --danger-soft:#40201E;
    --tang:#FFA24C; --sun:#FFD25C;
    --copper-text:#F7A65E; --olive-text:#45D3DB;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1A22; --surface:#15252F; --surface-2:#1D3140; --line:#2A4152;
  --ink:#EEF7F8; --ink-2:#BCD0D6; --ink-3:#8AA2AB;
  --olive:#45D3DB; --olive-ink:#062026; --olive-soft:#123A42;
  --copper:#F28C28; --copper-ink:#2A1103; --copper-soft:#3D2414;
  --sea:#7CC4FF; --danger:#FF8A80; --danger-soft:#40201E;
  --tang:#FFA24C; --sun:#FFD25C;
  --copper-text:#F7A65E; --olive-text:#45D3DB;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto}
main{padding:10px 18px calc(110px + env(safe-area-inset-bottom,0px))}
main.bare{padding-bottom:40px}
h1,h2,h3,p{margin:0}
.h1{font-size:30px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.h2{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sec{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:30px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec small{font-size:13px;font-weight:500;color:var(--ink-3)}
.sub{color:var(--ink-2);margin-top:6px;max-width:44ch}
.muted{color:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-3);margin-top:6px}
.empty-line{color:var(--ink-3);font-size:15px;padding:4px 0}
.svg{width:20px;height:20px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px;line-height:1.1;text-decoration:none;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn-join{background:var(--copper);color:var(--copper-ink)}
.btn-primary{background:var(--olive);color:var(--olive-ink)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.btn-quiet-danger{background:transparent;border-color:var(--line);color:var(--danger)}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-wide{width:100%;padding:15px 20px;font-size:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--sea);font-weight:600;font-size:14px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;position:relative;flex:none;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.iconbtn[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--copper);color:var(--copper-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* tags & chips */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag-olive{background:var(--olive-soft);color:var(--olive-text)}
.tag-copper{background:var(--copper-soft);color:var(--copper-text)}
.tag-danger{background:var(--danger-soft);color:var(--danger)}
.tag-xs{font-size:11px;padding:2px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.chip-static{cursor:default;font-weight:500;padding:5px 12px;font-size:13.5px}
.chip.on{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.excerpt{font-size:13.5px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-add{border-style:dashed;background:transparent;color:var(--ink)}
.tile-add .ctile svg{width:22px;height:22px;color:var(--ink-2)}
.composer-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px}
.composer-card textarea.inp{border:0;background:transparent;min-height:64px;padding:6px 8px;outline:none;resize:none}
.composer-card:focus-within{outline:2px solid var(--sea);outline-offset:1px}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 0 8px}
.stream{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.post{padding:14px 16px;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.post-head{display:flex;align-items:center;gap:10px}
.post-head .who{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.post-head time{display:block;font-size:12.5px;color:var(--ink-3)}
.post-x{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.post-actions{display:flex;gap:4px;margin:10px 0 0 -8px;flex-wrap:wrap}
.post-actions button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.post-actions button:hover{background:var(--surface-2)}
.post-actions svg{width:18px;height:18px}
.post-actions button[aria-pressed="true"]{color:var(--copper)}
.post-actions button[aria-pressed="true"] svg{fill:currentColor}
.iconbtn-sm{width:34px;height:34px;border:0;background:transparent}
.mini-act{display:flex;gap:14px;margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-decoration:none}
.mini-when{flex:none}
.mini-when b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.mini-when span{font-size:12px;color:var(--ink-3)}
.mini-body{display:flex;flex-direction:column;min-width:0;font-size:13px;color:var(--ink-2)}
.mini-body b{font-size:15px;color:var(--ink)}
.reply{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.reply:first-child{border-top:0}
.sec small a{color:var(--sea);text-decoration:none;font-weight:600}
.feed-link{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:3px}
.chipwrap .chip{white-space:normal;text-align:left;max-width:100%}
.row2 > *{min-width:0;width:100%}
.topbar{flex-wrap:wrap;gap:8px}
.chip-static.shared{background:var(--olive-soft);border-color:transparent;color:var(--olive-text);font-weight:700}

/* top of discover */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.brand svg{width:150px;height:41px;color:var(--ink);display:block}
.greet{font-size:31px;font-weight:700;letter-spacing:-.018em;line-height:1.08;margin:20px 0 6px}
.arealine{display:flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--ink-2);font-size:15px}
.arealine select{border:0;background:transparent;font-weight:700;color:var(--ink);padding:4px 2px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--copper);text-decoration-thickness:2px;cursor:pointer;-webkit-appearance:none;appearance:none;max-width:100%;text-overflow:ellipsis}
.search{margin:16px 0 12px;position:relative}
.search input{width:100%;padding:12px 14px 12px 42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}

/* banners */
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--olive-soft);color:var(--ink);margin:14px 0 0;font-size:14.5px}
.banner b{font-weight:700}
.banner .btn{margin-left:auto}
.banner-copper{background:var(--copper-soft)}
.banner-danger{background:var(--danger-soft)}

/* timeline */
.tl-wrap{margin:0 -18px;overflow-x:auto;scrollbar-width:none;padding:0 18px 4px}
.tl-wrap::-webkit-scrollbar{display:none}
.tl{position:relative}
.tl-axis{position:absolute;left:0;right:0;top:27px;height:2px;background:var(--line);border-radius:2px}
.tl-tick{position:absolute;top:0;font-size:12px;color:var(--ink-3);transform:translateX(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-tick::after{content:"";position:absolute;left:50%;top:22px;width:1px;height:8px;background:var(--ink-3);opacity:.5}
.tl-now{position:absolute;top:18px;bottom:6px;width:2px;background:var(--copper);border-radius:2px}
.tl-now span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--copper)}
.tl-dot{position:absolute;top:23px;width:10px;height:10px;border-radius:50%;background:var(--olive);transform:translateX(-50%);box-shadow:0 0 0 3px var(--bg)}
.tl-dot.live{background:var(--copper)}
.tl-pill{position:absolute;width:172px;min-height:56px;padding:8px 11px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;justify-content:center;gap:1px}
.tl-pill::before{content:"";position:absolute;left:11px;bottom:100%;width:2px;height:var(--stem);background:var(--line)}
.tl-pill .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-pill .m{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-pill .m b{color:var(--copper);font-weight:700}
.tl-empty{position:absolute;left:0;right:0;top:46px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:15px}

/* activity rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.act{position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;padding:15px 16px;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act:focus-within{background:color-mix(in srgb,var(--surface-2) 50%,var(--surface))}
.act-when b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.act-when span{display:block;font-size:12px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.act h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.act h3 a{text-decoration:none}
.act h3 a::after{content:"";position:absolute;inset:0}
.act h3 a:focus-visible{outline:none}
.host{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--ink-2);margin-top:4px}
.act-foot{display:flex;align-items:center;gap:8px 10px;margin-top:10px;flex-wrap:wrap;font-size:13px}
.act-foot .spots{color:var(--ink-2)}
.act-foot .price{font-weight:700}
.act-foot .end{margin-left:auto;position:relative;z-index:1}
.foryou{font-size:12px;font-weight:700;color:var(--copper-text)}
.facepile{display:inline-flex}
.facepile .av+.av{margin-left:-8px}
.facepile .av{box-shadow:0 0 0 2px var(--surface)}

/* avatars */
.av{width:var(--s,36px);height:var(--s,36px);border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:700;font-size:calc(var(--s,36px)*.38);color:#fff;background:var(--c,#5E6B3A);overflow:hidden;line-height:1;letter-spacing:0}
.av img{width:100%;height:100%;object-fit:cover}
.btn-wide{min-width:0;white-space:normal;text-align:center;line-height:1.2}
.btn[data-act="comm-schedule"],.btn[data-act="announce"],.btn[data-act="join-comm"],.btn[data-act="leave-comm"]{white-space:normal;min-width:0;text-align:center;line-height:1.2}
.fi{width:1.2em;height:1.2em;flex:none;vertical-align:-.24em;margin-right:.4em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ctile .fi,.story .ring .fi{width:26px;height:26px;margin:0;color:color-mix(in srgb,var(--cc) 62%,var(--ink));stroke-width:1.8}
.ctile{font-size:0}
.ig-act-media .big-e .fi{width:46px;height:46px;margin:0;stroke-width:1.6;color:color-mix(in srgb,var(--cc) 62%,var(--ink))}
.ig-act-media.has-photo .big-e .fi{color:#fff}
.d-cat .fi,.feed-link .fi{margin-right:.25em}
.legal-links a{color:var(--sea);font-weight:600;white-space:nowrap}
.legal{max-width:680px;padding-bottom:40px}
.legal h2{font-size:18px;font-weight:700;margin:24px 0 6px;color:var(--ink)}
.legal p,.legal li{font-size:15px;line-height:1.6;color:var(--ink-2)}
.legal p{margin:0 0 10px}
.legal ul{margin:0 0 10px;padding-left:20px}
.legal li{margin-bottom:6px}
.legal li b{color:var(--ink)}
.legal a{color:var(--sea);overflow-wrap:anywhere}
.legal .banner{margin:4px 0 12px}
.act-cover{grid-column:1/-1;display:block;margin:-15px -16px 2px;aspect-ratio:2.6/1;overflow:hidden;background:var(--surface-2)}
.act-cover img,.d-cover img,.cover-prev img{width:100%;height:100%;object-fit:cover;display:block}
.d-cover{margin:6px -18px 4px;aspect-ratio:16/9;overflow:hidden;background:var(--surface-2)}
.cover-edit{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.cover-prev{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.ig-act-media.has-photo{color:#fff;background:#13242C;overflow:hidden}
.ig-act-media .ig-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ig-act-media.has-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.78) 100%)}
.ig-act-media.has-photo > :not(.ig-photo){position:relative;z-index:1}
.ig-act-media.has-photo .kind{position:absolute}
.ig-act-media.has-photo .big-e{display:none}
.ig-act-media.has-photo .when,.ig-act-media.has-photo .where,.ig-act-media.has-photo .going{color:rgba(255,255,255,.92)}
.ig-act-media.has-photo .facepile .av{box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.actionbar{flex-wrap:wrap;row-gap:8px}
.actionbar .info{flex:1 1 120px}
.actionbar .btn{white-space:normal;min-width:0}
.feedline{flex-wrap:wrap}
.photo-edit{display:flex;align-items:center;gap:16px;margin:10px 0 8px}
.photo-btns{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.photo-btns .btn{white-space:normal;max-width:100%;text-align:center;line-height:1.25}
.photo-pick{position:relative;cursor:pointer}
.photo-pick:focus-within{outline:2px solid var(--olive);outline-offset:2px}
.photo-pick.is-busy{opacity:.7;cursor:progress}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* horizontal tiles */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tile{flex:none;width:150px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;text-decoration:none;display:flex;flex-direction:column;gap:8px}
.tile b{font-size:14.5px;line-height:1.25}
.tile span{font-size:12.5px;color:var(--ink-2)}
.tile .av{color:#fff;font-size:calc(var(--s,36px)*.38)}
.ctile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--cc) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 35%,transparent);flex:none}

/* community rows */
.comm{position:relative;display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start}
.comm:first-child{border-top:0}
.comm h3{font-size:16px;font-weight:700}
.comm h3 a{text-decoration:none}
.comm h3 a::after{content:"";position:absolute;inset:0}
.comm-body{min-width:0}

/* people rows */
.prow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow-main{flex:1;display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;min-width:0}
.prow-txt{display:flex;flex-direction:column;min-width:0}
.prow-txt b{font-size:15.5px}
.prow-ints{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* detail pages */
.backbar{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.backbar .spacer{flex:1}
.d-cat{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--olive-text);background:var(--olive-soft);padding:5px 12px;border-radius:999px;margin-top:10px}
.d-title{font-size:32px;font-weight:700;letter-spacing:-.018em;line-height:1.08;margin:12px 0 0}
.d-host{display:flex;align-items:center;gap:10px;margin-top:16px;background:none;border:0;padding:0;text-align:left}
.d-host small{display:block;font-size:12.5px;color:var(--ink-3)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;margin:22px 0 0;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.facts dt{font-size:13px;color:var(--ink-3);padding-top:2px}
.facts dd{margin:0;font-weight:600}
.facts dd small{display:block;font-weight:400;color:var(--ink-2);font-size:13.5px}
.meet{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px 16px;border-radius:18px;border:1px dashed var(--line);color:var(--ink-2);font-size:14.5px}
.meet.open{border-style:solid;border-color:transparent;background:var(--copper-soft);color:var(--ink)}
.meet svg{width:20px;height:20px;flex:none;margin-top:1px}
.meet b{display:block}
.desc{margin-top:22px;white-space:pre-wrap;max-width:62ch;color:var(--ink)}
.people-list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.prow .who{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.actionbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:26px;display:flex;gap:10px;align-items:center;padding:10px 10px 10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.actionbar .info{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actionbar .info b{display:block;color:var(--ink);font-size:15px;overflow:hidden;text-overflow:ellipsis}

/* group page */
.g-hero{margin-top:6px;padding:22px 20px;border-radius:24px;background:color-mix(in srgb,var(--cc) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 30%,transparent)}
.g-hero .e{font-size:38px;line-height:1}
.g-actions .btn{padding:9px 16px;font-size:14px}
.g-hero h1{margin-top:12px}
.g-hero p{margin-top:8px;max-width:52ch;color:var(--ink-2)}
.g-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.ann{padding:14px 16px;border-top:1px solid var(--line)}
.ann:first-child{border-top:0}
.ann p{white-space:pre-wrap;margin-top:6px}
.ann .meta{margin-top:0}

/* forms */
.field{margin:22px 0 0}
.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
textarea.inp{min-height:92px;resize:vertical;line-height:1.45}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp:focus{outline:2px solid var(--sea);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.45;cursor:default}
.stepper{display:flex;align-items:center;gap:16px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:21px;font-weight:600;line-height:1}
.stepper b{font-size:24px;font-weight:700;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--olive);flex:none}
.err{color:var(--danger);font-size:14px;margin-top:14px;font-weight:600}
.cat-head{font-size:13.5px;font-weight:700;color:var(--ink-2);margin:16px 0 8px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.areas button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 14px;text-align:left;font-weight:700;font-size:16px}
.areas button small{display:block;font-weight:500;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.areas button[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft);box-shadow:inset 0 0 0 1px var(--olive)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--sw)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.emojis{display:flex;gap:8px;flex-wrap:wrap}
.emojis button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.emojis button[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft);box-shadow:inset 0 0 0 1px var(--olive)}

/* onboarding */
.ob{min-height:calc(100vh - 60px);display:flex;flex-direction:column;padding-top:20px}
.ob-mark{width:220px;height:60px;color:var(--ink);margin-top:8vh}
.ob-mark svg{width:100%;height:100%;display:block}
.ob-title{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.02;margin-top:28px;max-width:12ch}
.ob-title span{display:block;color:var(--olive)}
.ob-progress{display:flex;gap:6px;margin:6px 0 22px}
.ob-progress i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.ob-progress i.on{background:var(--olive)}
.ob-foot{margin-top:auto;padding-top:28px;display:flex;gap:10px}

/* profile */
.me-head{display:flex;gap:16px;align-items:center;margin-top:8px}
.me-stats{display:flex;gap:18px;margin-top:16px;font-size:14px;color:var(--ink-2)}
.me-stats b{color:var(--ink);font-size:16px}
.bio{margin-top:14px;max-width:56ch;white-space:pre-wrap}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-weight:600}
.menu button:first-child{border-top:0}
.menu button span{font-weight:500;color:var(--ink-3);font-size:14px}

/* chat */
.chat{position:fixed;inset:0;z-index:25;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-in{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-head .t{flex:1;min-width:0}
.chat-head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .t span{font-size:12.5px;color:var(--ink-3)}
.pin{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;background:var(--copper-soft);font-size:14px}
.pin svg{width:18px;height:18px;flex:none;margin-top:2px}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column}
.sysmsg{text-align:center;font-size:13px;color:var(--ink-3);margin:6px auto 16px;max-width:36ch}
.msg-who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin:12px 0 4px;font-weight:600}
.msg-who time{color:var(--ink-3);font-weight:400}
.msg-who.me{justify-content:flex-end}
.msg{max-width:80%;margin:2px 0;padding:9px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start;font-size:15px}
.msg.me{align-self:flex-end;background:var(--olive);color:var(--olive-ink);border-color:transparent}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:44px;border-radius:22px;padding:11px 16px}
.composer .iconbtn{background:var(--copper);color:var(--copper-ink);border-color:var(--copper);width:44px;height:44px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:66px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--olive-text)}
.nav a.create,.nav button.create{color:var(--ink-2)}
.nav a.create .plus,.nav button.create .plus{width:42px;height:42px;border-radius:50%;background:var(--copper);color:var(--copper-ink);display:grid;place-items:center;margin-top:-2px}
.nav a.create[aria-current="page"] .plus,.nav button.create[aria-current="page"] .plus{box-shadow:0 0 0 3px var(--copper-soft)}
.nav a.create span:last-child,.nav button.create span:last-child{margin-top:-1px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,30,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px))}
.sheet.enter{animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-close{position:absolute;top:14px;right:14px}
.sheet .h2{padding-right:48px}
.sh{font-size:15px;font-weight:700;margin:22px 0 10px}
.ps-head{display:flex;gap:14px;align-items:center}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.opt{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:8px;text-align:left;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft)}
.notif{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.notif:first-of-type{border-top:0}
.notif p{font-size:14.5px;line-height:1.4}
.notif time{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.notif .new{width:8px;height:8px;border-radius:50%;background:var(--copper);margin-top:7px;flex:none}
.notif .ico{width:36px;height:36px;border-radius:50%;background:var(--olive-soft);color:var(--olive);display:grid;place-items:center;flex:none}
.notif .ico svg{width:18px;height:18px}
.tips{padding-left:20px;margin:14px 0 0}
.tips li{margin-top:10px}

/* toast & loading */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:600;max-width:min(92vw,480px);text-align:center;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:60vh;color:var(--ink-2)}
.loading svg{width:126px;height:34px;color:var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.empty{text-align:center;padding:48px 12px;color:var(--ink-2)}
.empty h2{color:var(--ink);margin-bottom:8px}
.empty .btn{margin-top:18px}
/* language */
.lang-btn{font-weight:700;font-size:13px;letter-spacing:.02em}
/* safety */
.sos-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sos{border:1px solid var(--line);border-radius:18px;padding:12px 14px 6px;background:var(--surface)}
.sos.here{border-color:var(--copper);box-shadow:inset 0 0 0 1px var(--copper)}
.sos-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;line-height:1.25}
.sos-row{display:flex;align-items:center;gap:12px;padding:8px 0;text-decoration:none;border-top:1px solid var(--line);font-size:14.5px;line-height:1.3}
.sos-head + .sos-row{border-top:0}
.sos-num{min-width:50px;font-size:23px;font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums}
@media (max-width:440px){.sos-grid{grid-template-columns:1fr}}
/* club calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 12px 6px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.cal-head b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.cal-head .iconbtn{width:36px;height:36px}
.cal-head .iconbtn svg{width:18px;height:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:11.5px;color:var(--ink-3);font-weight:600;padding:2px 0 6px}
.cal-day{height:46px;border:0;background:none;border-radius:12px;font-size:15px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-variant-numeric:tabular-nums}
.cal-day.past{color:var(--ink-3);font-weight:500}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--tang)}
.cal-day[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink);box-shadow:none}
.cal-dots{display:flex;gap:3px;height:6px}
.cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--d)}
.cal-day[aria-pressed="true"] .cal-dots i{background:var(--olive-ink)}
.cal-sel{font-size:14px;font-weight:700;color:var(--ink-2);padding:14px 4px 4px;margin-top:8px;border-top:1px solid var(--line)}
.cal-row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
.cal-sel + .cal-row{border-top:0}
.cal-row .ctile{width:42px;height:42px;font-size:20px;border-radius:12px}
.cal-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.cal-row .txt a{font-weight:700;text-decoration:none}
.cal-row .txt a::after{content:"";position:absolute;inset:0}
.cal-row .txt span{font-size:13px;color:var(--ink-2)}
.cal-row .btn,.cal-row .tag{position:relative;z-index:1}
.cal-empty{font-size:14px;color:var(--ink-3);padding:6px 4px 10px}
.act-when span.soon{color:var(--copper);font-weight:700}
/* instagram-style feeds */
.ig-top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 2px}
.ig-top h1{font-size:27px;font-weight:700;letter-spacing:-.015em}
.ig-top .acts{display:flex;gap:8px}
.stories{position:relative;display:flex;gap:12px;overflow-x:auto;margin:8px -18px 0;padding:8px 18px 12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;color:var(--ink-3);font-size:11.5px;font-weight:600}
.story .ring{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:color-mix(in srgb,var(--cc) 18%,var(--surface));box-shadow:0 0 0 1px var(--line)}
.story[aria-selected="true"]{color:var(--ink);font-weight:700}
.story[aria-selected="true"] .ring{box-shadow:0 0 0 3px var(--bg)}
.story[aria-selected="true"] .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--sun),var(--tang),var(--copper),#8A5CF0,var(--sun));z-index:-1}
.story .new{position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:50%;background:var(--copper);box-shadow:0 0 0 2.5px var(--bg)}
.story .lbl{max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-add .ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.story-add .ring svg{width:24px;height:24px}
.swipe-hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin:0 0 6px}
#feed-stage{touch-action:pan-y;min-height:60vh}
#feed-stage .hscroll{touch-action:pan-x pan-y}
#feed-stage.in-r{animation:inR .28s cubic-bezier(.2,.8,.2,1)}
#feed-stage.in-l{animation:inL .28s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(56px);opacity:.2}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-56px);opacity:.2}to{transform:none;opacity:1}}
.feedline{display:flex;align-items:center;gap:10px;padding:14px 0 4px;border-top:1px solid var(--line)}
.feedline h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.feedline .meta{margin:0}
.feedline .btn{margin-left:auto}
.compose-bar{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0 20px;background:none;border:0;text-align:left}

.ig{margin:0 0 30px}
.ig-head{display:flex;align-items:center;gap:10px;padding:0 0 10px}
.ig-head .who{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0;line-height:1.25}

.ig-head .who small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500}
.ig-media{position:relative;margin:0 -18px;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;padding:34px 30px;background:var(--pc);color:#fff;user-select:none;-webkit-user-select:none;text-decoration:none}
.ig-media p{font-weight:700;letter-spacing:-.015em;line-height:1.22;white-space:pre-wrap;overflow-wrap:anywhere;max-width:30ch}
.ig-media .src{position:absolute;left:30px;bottom:22px;font-size:13px;font-weight:600;opacity:.75}
.ig-act-media{aspect-ratio:4/3;justify-content:flex-end;gap:4px;background:color-mix(in srgb,var(--cc) 20%,var(--surface));color:var(--ink)}
.ig-act-media .big-e{position:absolute;top:24px;right:26px;font-size:48px;line-height:1}
.ig-act-media .kind{position:absolute;top:26px;left:30px}
.ig-act-media .when{font-size:15px;font-weight:700;color:var(--copper-text)}
.ig-act-media .title{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.08;max-width:17ch}
.ig-act-media .where{font-size:14.5px;color:var(--ink-2);margin-top:2px}
.ig-act-media .going{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin-top:10px}
.ig-act-media .facepile .av{box-shadow:0 0 0 2px color-mix(in srgb,var(--cc) 20%,var(--surface))}
.ig-actions{display:flex;align-items:center;gap:2px;margin:6px 0 0 -9px;min-height:44px}
.ig-actions > button:not(.btn){display:inline-grid;place-items:center;width:44px;height:44px;background:none;border:0;border-radius:12px;color:var(--ink)}
.ig-actions svg{width:25px;height:25px}
.ig-actions > button[aria-pressed="true"]{color:var(--copper)}
.ig-actions > button[aria-pressed="true"] svg{fill:currentColor}
.ig-actions .spacer{flex:1}
.ig-actions .btn,.ig-actions .tag{margin-left:9px}
.ig-likes{font-size:14.5px;font-weight:700}
.ig-cap{font-size:14.5px;margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ig-cap b{margin-right:6px}
.ig-more{background:none;border:0;padding:0;color:var(--ink-3);font-size:14px;margin-top:4px;display:block;text-align:left}
.ig-clubs{margin:0 0 30px;padding:16px 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ig-clubs h3{font-size:15.5px;font-weight:700;margin-bottom:12px}
.ig-clubs h3 small{font-weight:500;color:var(--ink-3);font-size:13px;margin-left:6px}
.club-tile{flex:none;width:158px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.club-tile a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none}
.club-tile b{font-size:14px;line-height:1.25}
.club-tile > span{font-size:12.5px;color:var(--ink-2)}
.club-tile .btn{margin-top:auto;width:100%}
.club-tile.add{border-style:dashed;background:transparent}
.club-tile.add .ctile svg{width:22px;height:22px;color:var(--ink-2)}
.heart-pop{position:fixed;z-index:70;pointer-events:none;width:110px;height:110px;color:#fff;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));transform:translate(-50%,-50%);animation:pop .85s ease-out forwards}
.heart-pop svg{width:100%;height:100%;fill:currentColor}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12);opacity:1}32%{transform:translate(-50%,-50%) scale(.96)}72%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@media (min-width:600px){.ig-media{margin:0;border-radius:18px}.stories{margin:8px -24px 0;padding:8px 24px 12px}}
@media (prefers-reduced-motion: reduce){
  #feed-stage.in-r,#feed-stage.in-l{animation:none}
  .heart-pop{animation:none;opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .sheet.enter,.loading svg{animation:none}
  .toast{transition:none}
}
@media (min-width:600px){
  main{padding-left:24px;padding-right:24px}
  .chips,.hscroll,.tl-wrap{margin:0 -24px;padding-left:24px;padding-right:24px}
}

/* ---------- opening screen: the logo is drawn letter by letter ---------- */
#intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#0E1A22;cursor:pointer;animation:introOut .4s ease 4.25s forwards}
#intro.skip{animation:introOut .2s ease forwards}
.no-intro #intro{display:none}
#intro svg{width:min(72vw,440px);height:auto;overflow:visible}
#intro .intro-in{display:flex;flex-direction:column;align-items:center;gap:18px}
#intro .intro-tag{margin:0;font-family:var(--font);font-weight:500;font-size:clamp(15px,4.2vw,20px);letter-spacing:.08em;color:#B9C7CE;text-align:center;opacity:0;animation:introTag .6s ease 2.1s both,introSideOut .25s ease 3.8s forwards}
@keyframes introTag{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#intro .ln{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation-name:introDraw;animation-timing-function:cubic-bezier(.55,0,.35,1);animation-fill-mode:both}
#intro .head{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:introHead .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes introHead{0%{opacity:0;transform:translateY(-260%)}60%{opacity:1;transform:translateY(12%) scale(1.06,.9)}100%{opacity:1;transform:none}}
#intro .mark{transform-origin:50% 50%;animation:introPunch .55s cubic-bezier(.2,.9,.3,1) 2.35s both}
#intro .lt{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:introDrop .5s cubic-bezier(.2,.9,.25,1.25) both}
#intro .mcol{opacity:0;animation:introColor .4s ease both}
@keyframes introColor{to{opacity:1}}
#intro .lt.side{animation-name:introDrop,introSideOut;animation-duration:.5s,.3s;animation-timing-function:cubic-bezier(.2,.9,.25,1.25),ease;animation-fill-mode:both,forwards}
#intro .mm-zoom{transform-box:fill-box;transform-origin:50% 58%;animation:introZoom .72s cubic-bezier(.55,0,.95,.35) 3.8s both}
@keyframes introSideOut{to{opacity:0}}
@keyframes introZoom{0%{transform:scale(1)}100%{transform:scale(26)}}
@keyframes introDrop{0%{opacity:0;transform:translateY(-38%) scaleY(1.08)}55%{opacity:1;transform:translateY(4%) scaleY(.96)}100%{opacity:1;transform:none}}
@keyframes introDraw{0%{stroke-dashoffset:1;opacity:0}6%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes introPop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes introPunch{0%{transform:scale(1);filter:none}45%{transform:scale(1.07);filter:drop-shadow(0 0 22px rgba(242,140,40,.5))}100%{transform:scale(1.03);filter:drop-shadow(0 0 0 rgba(242,140,40,0))}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){
  #intro{animation-delay:.9s}
  #intro .ln,#intro .lt,#intro .lt.side,#intro .mcol,#intro .mm-zoom,#intro .head,#intro .mark,#intro .intro-tag{animation:none;stroke-dashoffset:0;opacity:1;transform:none}
}

/* ---------- profile and settings ---------- */
.pro-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:6px}
.pro-top{display:flex;gap:16px;align-items:center}
.pro-top .av{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--olive)}
.pro-id{min-width:0}
.pro-name{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pro-badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--olive-text);background:var(--olive-soft);padding:4px 8px;border-radius:999px}
.pro-meta{margin:6px 0 0;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.pro-meta svg{width:16px;height:16px;flex:none}
.pro-since{margin:3px 0 0;font-size:13px;color:var(--ink-3)}
.pro-bio{margin:14px 0 0;font-size:15px;line-height:1.55;color:var(--ink)}
.pro-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pro-actions .btn{flex:1 1 140px;justify-content:center}
.pro-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pro-stats > div{padding:14px 6px;text-align:center;display:flex;flex-direction:column;gap:3px}
.pro-stats > div + div{border-left:1px solid var(--line)}
.pro-stats b{font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
.pro-stats span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.pro-nudge{margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.pro-nudge-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px}
.pro-nudge-top a{font-weight:700;color:var(--sea);white-space:nowrap}
.pro-bar{height:6px;border-radius:99px;background:var(--surface-2);margin:10px 0 8px;overflow:hidden}
.pro-bar i{display:block;height:100%;background:var(--olive);border-radius:inherit}
.pro-nudge p{margin:0;font-size:13.5px;color:var(--ink-3)}
.pro-tags{display:flex;flex-wrap:wrap;gap:8px}
.pro-tag{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none}
.pt-tabs{display:flex;width:100%;margin:0 0 12px}
.pt-tabs button{flex:1;display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 6px;min-width:0;white-space:normal;text-align:center;line-height:1.15;padding-left:6px;padding-right:6px}
.pt-n{font-size:12px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.pt-tabs button[aria-pressed="true"] .pt-n{background:var(--olive-soft);color:var(--olive-text)}
.pt-empty{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
.pt-empty p{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.pt-empty-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.req-line{margin:16px 0 4px;font-size:14px;color:var(--ink-2);line-height:1.5}
.req-line .linkbtn{font-size:14px}
.req-mail{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:15px;overflow-wrap:anywhere}
.req-mail svg{width:18px;height:18px;flex:none;color:var(--olive)}
.club-logo .fi{width:54%;height:54%;margin:0;color:color-mix(in srgb,var(--cc) 62%,var(--ink));stroke-width:1.8}
.club-logo.has-img{background:var(--surface-2);overflow:hidden;box-shadow:none;border:0}
.club-logo.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.club-logo.lg{width:76px;height:76px;border-radius:22px}
.g-hero .e{line-height:0;font-size:0}
.club-icons{display:flex;flex-wrap:wrap;gap:8px}
.club-icons button{padding:3px;border:2px solid transparent;border-radius:16px;background:none;cursor:pointer}
.club-icons button[aria-pressed="true"]{border-color:var(--ink)}
.club-icons .club-logo{width:42px;height:42px;border-radius:12px}
.uname-inp{position:relative;display:flex;align-items:center}
.uname-inp > span{position:absolute;left:14px;color:var(--ink-3);font-weight:700;pointer-events:none}
.uname-inp .inp{padding-left:31px}
.pro-user{margin:2px 0 0;font-size:14.5px;font-weight:600;color:var(--ink-2);overflow-wrap:anywhere}
.ps-user{margin:2px 0 4px;font-size:14px;font-weight:600;color:var(--ink-3)}
.prow-user{display:block;font-size:13px;font-weight:600;color:var(--ink-3);margin-top:1px}
.set-group{margin-top:20px}
.set-group h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 8px 6px;font-weight:700}
.set-list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);font:inherit;font-size:15.5px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.set-row:first-child{border-top:0}
.set-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.set-ico svg,.set-chev svg{width:18px;height:18px}
.set-lbl{flex:1;min-width:0}
.set-val{color:var(--ink-3);font-size:14px;font-weight:500;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-chev{color:var(--ink-3);display:grid}
.set-row.danger{color:var(--danger)}
.set-row.danger .set-ico{background:var(--danger-soft);color:var(--danger)}

/* ---------- instants ---------- */
.inst-ring{display:inline-grid;place-items:center;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,var(--olive),var(--copper),var(--olive));cursor:pointer;flex:none;vertical-align:middle}
.inst-ring.seen{background:var(--line)}
.inst-ring > .av{box-shadow:0 0 0 2px var(--surface)}
.inst-strip{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 12px;margin:2px -2px 4px;scrollbar-width:none}
.inst-strip::-webkit-scrollbar{display:none}
.inst-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:70px}
.inst-btn{position:relative;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;border-radius:50%;width:66px;height:66px}
.inst-lbl{font-size:12px;font-weight:600;color:var(--ink-2);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst-plus,.inst-more,.pro-inst{position:absolute;display:grid;place-items:center;border-radius:50%;background:var(--copper);color:var(--copper-ink);border:2px solid var(--surface);cursor:pointer}
.inst-plus{right:0;bottom:0;width:24px;height:24px}
.inst-more{right:0;top:44px;width:24px;height:24px}
.inst-plus svg,.inst-more svg{width:13px;height:13px}
.inst-hint{align-self:center;margin:0;font-size:13.5px;color:var(--ink-3);max-width:210px}
.pro-av{position:relative;flex:none}
.pro-inst{right:0;bottom:2px;width:30px;height:30px}
.pro-inst svg{width:15px;height:15px}
.inst-prev{margin-top:12px;border-radius:16px;overflow:hidden;background:#000;display:grid;place-items:center}
.inst-prev img{max-width:100%;max-height:52vh;object-fit:contain;display:block}
body.iv-open{overflow:hidden}
.iv{position:fixed;inset:0;z-index:45;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.iv-bars{display:flex;gap:4px;padding:10px 12px 0}
.iv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.iv-bars i.done::after,.iv-bars i.now::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left}
.iv-bars i.run::after{animation:ivRun 7s linear forwards}
@keyframes ivRun{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.iv-top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.iv-who{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}
.iv-who b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iv-who span{font-size:12.5px;opacity:.8}
.iv-x{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iv-x svg{width:20px;height:20px}
.iv-stage{flex:1;min-height:0;display:grid;place-items:center;cursor:pointer}
.iv-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.iv-err{opacity:.85;padding:20px;text-align:center}
.iv-spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:ivSpin .8s linear infinite}
@keyframes ivSpin{to{transform:rotate(360deg)}}
.iv-foot{display:flex;gap:10px;justify-content:center;padding:12px 16px 18px;flex-wrap:wrap}
.iv-btn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 16px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.iv-btn.danger{border-color:#FF8A80;color:#FFB4AB}
.iv-viewer{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.iv-viewer b{flex:1;min-width:0}
@media (prefers-reduced-motion: reduce){.iv-bars i.run::after{animation:none}.iv-spin{animation-duration:2s}}

.h1{font-size:29px;line-height:1.12}

/* ---------- dock bars (Discover) ---------- */
.dock{display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:16px 10px 10px;margin:2px 0 6px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);border-radius:12px;
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 30px rgba(10,30,40,.12),inset 0 1px 0 rgba(255,255,255,.08)}
.dock::-webkit-scrollbar{display:none}
.dock-item{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 2px 4px;border:0;background:none;font:inherit;color:var(--ink);text-decoration:none;cursor:pointer;border-radius:16px;transform-origin:50% 100%;transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.dock-item .ctile{width:54px;height:54px;border-radius:15px;flex:none}

.dock-lbl{font-size:12px;font-weight:600;line-height:1.2;text-align:center;max-width:76px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.dock-item:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
  .dock-item:hover{transform:translateY(-8px) scale(1.16)}
  .dock-item:hover + .dock-item,.dock-item:has(+ .dock-item:hover){transform:translateY(-4px) scale(1.07)}
}
@media (prefers-reduced-motion: reduce){.dock-item{transition:none}}

/* ---------- minimised dock sections (Discover) ---------- */
.dsec{margin:18px 0 4px}
.dsec-head{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:9px 14px 9px 18px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.dsec-head:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.dsec-title{flex:1;min-width:0;font-family:var(--font-head);font-weight:700;font-size:18px;line-height:1.15}
.dsec-prev{display:flex;align-items:center;flex:none}
.dsec-prev .ctile{width:30px;height:30px;border-radius:9px;margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.dsec-prev .ctile:first-child{margin-left:0}
.dsec-prev .ctile .fi{width:16px;height:16px}
.dsec-chev{display:grid;color:var(--ink-3);flex:none}
.dsec-chev svg{width:18px;height:18px;transform:rotate(90deg);transition:transform .2s ease}
.dsec.open .dsec-chev svg{transform:rotate(-90deg)}
.dsec .dock,.dsec .cal{margin-top:8px}
.dsec-prev .ctile > svg:not(.fi){width:16px;height:16px;color:color-mix(in srgb,var(--cc) 62%,var(--ink))}
.dsec-all{display:inline-block;margin:2px 6px 0;font-size:13.5px;font-weight:600;color:var(--sea)}
@media (max-width:360px){.dsec-prev .ctile:nth-child(n+4){display:none}}

/* ---------- flat style: content sits on the page, divided by thin lines ---------- */
.list,.people-list,.stream,.menu,.set-list,.cal,.facts,.pro-card,.pro-nudge,.pt-empty{background:transparent;border:0;border-radius:0;box-shadow:none}
.list,.people-list,.stream,.menu,.set-list{overflow:visible}
.act,.comm,.post,.prow,.menu button,.set-row,.cal-row,.cal-empty{padding-left:0;padding-right:0}
.list > :first-child,.stream > :first-child{border-top:0}
.act-cover{margin:0 0 4px;border-radius:14px}
.set-group h2{margin-left:0}
.cal{padding:4px 0 0}
.facts{padding:16px 0 0;border-top:1px solid var(--line)}
.pro-card{padding:4px 0 0}
.pro-top .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--olive)}
.pro-stats{background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0}
.pro-nudge{padding:14px 0;border-bottom:1px solid var(--line)}
.pt-empty{padding:14px 0}
.dsec{margin:0;border-top:1px solid var(--line)}
.dsec-head{background:transparent;border:0;border-radius:0;min-height:58px;padding:10px 0}
.dsec .dock,.dsec .cal{margin:0 0 14px}
.dock{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:12px 0 6px;border-radius:0}
.dsec-prev .ctile{box-shadow:0 0 0 2px var(--bg)}

/* ---------- home: story-style circles, sharp activity boxes ---------- */
.sring{display:grid;place-items:center;padding:3px;border-radius:50%;background:conic-gradient(from 210deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75);flex:none}
.sring .ctile{border-radius:50%;box-shadow:0 0 0 3px var(--bg)}
.dock-item .sring .ctile{width:52px;height:52px}
.dsec-prev .ctile,.dsec .cal .ctile{border-radius:50%}
.list.boxed{background:var(--surface);border:1px solid var(--line);border-radius:0;overflow:hidden}
.list.boxed .act{padding-left:14px;padding-right:14px}
.list.boxed .act-cover{border-radius:0;margin:-15px -14px 4px}

/* ---------- names inside circles ---------- */
.story{width:78px}
.story .ring{width:70px;height:70px}
.nb-t{display:block;max-width:60px;font-weight:700;line-height:1.08;text-align:center;color:color-mix(in srgb,var(--cc) 38%,var(--ink));overflow-wrap:normal;word-break:normal}
.cb{width:92px;height:92px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center;background:color-mix(in srgb,var(--cc) 20%,var(--surface));border:1.5px solid color-mix(in srgb,var(--cc) 62%,var(--ink));color:var(--ink);flex:none}
.cb-ic{display:grid}
.cb-ic .fi{width:15px;height:15px;margin:0;color:color-mix(in srgb,var(--cc) 45%,var(--ink))}
.cb b{font-weight:700;line-height:1.1;max-width:74px}
.cb small{font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--cc) 35%,var(--ink));max-width:70px;line-height:1.1}
.cb-img{overflow:hidden;padding:0;border:1px solid var(--line);background:var(--surface-2)}
.cb-img img{width:100%;height:100%;object-fit:cover}
.dock-item.cb-item{width:100px}

/* ---------- Create menu ---------- */
.nav button.create{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;padding:0;margin:0;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.nav-in{position:relative}
.cm-pop{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;gap:4px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);z-index:2;animation:cmIn .16s ease-out}
@keyframes cmIn{from{opacity:0;transform:translate(-50%,8px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.cm-mini{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:5px 4px;border:0;background:none;border-radius:16px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer}
.cm-dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 18%,var(--surface));color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
.cm-dot svg{width:20px;height:20px;margin:0}
.cm-mini:focus-visible,.cm-mini:focus-within{outline:2px solid var(--olive);outline-offset:1px}
.nav .plus svg{transition:transform .18s ease}
.nav button.create[aria-expanded="true"] .plus svg{transform:rotate(45deg)}
@media (prefers-reduced-motion: reduce){.cm-pop{animation:none}.nav .plus svg{transition:none}}

/* ---------- minimal interests on Profile ---------- */
.pro-ints{margin:2px 0 0;font-size:15px;line-height:1.75;color:var(--ink-3)}
.pro-ints a{color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.pro-ints a:hover,.pro-ints a:focus-visible{text-decoration:underline}
.pro-ints .dot{color:var(--ink-3)}
.pro-more{font-size:14px;font-weight:600;color:var(--sea)}

/* ---------- connections on a profile panel ---------- */
.ps-conns{display:flex;flex-wrap:wrap;gap:12px 6px;margin-top:4px}
.ps-conn{display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;border:0;background:none;padding:0;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.ps-conn span{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-more{align-self:center;font-size:13px;font-weight:600;color:var(--ink-3)}

.story-add .lbl{max-width:78px;white-space:normal;overflow:visible;text-overflow:clip;text-align:center;line-height:1.15}

/* ---------- sponsored cards (16:9) and the Ads page ---------- */
.ad-card{position:relative;width:100%;aspect-ratio:16/9;margin:14px 0;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--olive) 14%,var(--surface));border:1px solid var(--line)}
.ad-card.has-img{background:#1b1b1b;border:0}
.ad-link{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:var(--ink)}
.ad-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ad-tag{position:absolute;top:10px;left:10px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--ink) 10%,var(--surface));color:var(--ink-2)}
.has-img .ad-tag{background:rgba(0,0,0,.6);color:#fff}
.ad-body{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px 14px 12px}
.has-img .ad-body{padding-top:30px;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.6) 55%,rgba(0,0,0,0) 100%);color:#fff}
.ad-title{font-family:var(--font-head);font-size:18px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-text{font-size:13.5px;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.has-img .ad-text{color:#fff}
.ad-go{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--sea)}
.has-img .ad-go{color:#fff;text-decoration:underline;text-underline-offset:2px}
.ad-go svg{width:14px;height:14px}
.ad-link:hover .ad-title{text-decoration:underline}
.ad-link:focus-visible{outline:2px solid var(--olive);outline-offset:-3px;border-radius:14px}
@media (max-width:360px){.ad-text{-webkit-line-clamp:1}.ad-title{font-size:16.5px}}
.ad-prev{width:100%;max-width:340px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;margin:4px 0 8px}
.ad-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ad-row:first-child{border-top:0}
.ad-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.ad-row-main b{font-size:15.5px}
.ad-row-main span{font-size:13px;color:var(--ink-3)}
.ad-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ig-feedtag{flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);text-decoration:none}
.ig-feedtag:hover,.ig-feedtag:focus-visible{border-color:var(--ink-3);color:var(--ink)}

/* ---------- App stats (moderators) ---------- */
.st-bigs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0 4px}
.st-big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:14px 4px;text-align:center;min-width:0}
.st-big + .st-big{border-left:1px solid var(--line)}
.st-big b{font-family:var(--font-head);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.st-big span{font-size:12.5px;line-height:1.25;color:var(--ink-3)}
.st-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.st-row b{font-variant-numeric:tabular-nums}
.st-chart{display:flex;align-items:flex-end;gap:3px;height:96px;padding-top:6px;border-bottom:1px solid var(--line)}
.st-chart i{flex:1;background:var(--olive);border-radius:3px 3px 0 0;min-height:3px}
.st-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin:4px 0 6px}
.st-area{display:grid;grid-template-columns:minmax(0,1fr) 40% auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.st-area span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-area i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--olive) var(--w),color-mix(in srgb,var(--olive) 15%,transparent) var(--w))}
.st-area b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.st-note{font-size:13px;color:var(--ink-3);margin:8px 0 0}

/* ---------- likes on instants ---------- */
.iv-like{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;flex:none}
.iv-like svg{width:24px;height:24px}
.iv-like[aria-pressed="true"]{border-color:#FF5A76}
.iv-like[aria-pressed="true"] svg{fill:#FF3B5C;stroke:#FF3B5C}
.iv-like.pop svg{animation:likePop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes likePop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.iv-hearts{display:inline-flex;align-items:center;gap:3px}
.iv-hearts svg{width:15px;height:15px;fill:#FF3B5C;stroke:#FF3B5C}
.iv-liked{display:grid;margin-left:auto}
.iv-liked svg{width:18px;height:18px;fill:#E0244A;stroke:#E0244A}
.iv-liked + .muted{margin-left:8px}
@media (prefers-reduced-motion: reduce){.iv-like.pop svg{animation:none}}

/* ---------- app announcements ---------- */
.nt-scrim{position:fixed;inset:0;z-index:80;background:rgba(8,18,12,.58);display:grid;place-items:center;padding:20px;animation:ntIn .22s ease}
.nt{position:relative;width:min(100%,420px);max-height:min(82vh,580px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 20px 20px;box-shadow:0 22px 60px rgba(0,0,0,.32)}
.nt-x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.nt-x svg{width:20px;height:20px}
.nt-x:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.nt-tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--olive-text);background:var(--olive-soft);padding:3px 9px;border-radius:999px}
.nt h2{font-family:var(--font-head);font-size:24px;line-height:1.2;margin:12px 46px 8px 0}
.nt p{margin:0 0 4px;font-size:15.5px;line-height:1.55;color:var(--ink-2);overflow-wrap:anywhere}
.nt-go{width:100%;justify-content:center}
body.nt-open{overflow:hidden}
@keyframes ntIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.nt-scrim{animation:none}}

/* ---------- home top bar: language left, logo centred, bell right ---------- */
.topbar-c{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:8px 0 2px;flex-wrap:nowrap}
.brand-c{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.brand-c .brand{justify-content:center}
.tagline{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);text-align:center;line-height:1.2}
.iconbtn.bell{position:relative;background:var(--olive);color:var(--olive-ink);border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--olive) 35%,transparent)}
.iconbtn.bell svg{width:22px;height:22px}
.iconbtn.bell.bell-float{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,calc((100vw - 560px) / 2 + 16px));z-index:40;opacity:0;transform:translateY(-10px) scale(.9);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
body.scrolled .iconbtn.bell.bell-float{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion: reduce){.bell-float{transition:none}}

/* ---------- sign-up: age confirmation ---------- */
.age-confirm{align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;cursor:pointer}
.age-confirm input{width:24px;height:24px;margin:0}
.age-confirm:has(input:checked){border-color:var(--olive);background:color-mix(in srgb,var(--olive) 8%,var(--surface))}
.age-confirm:focus-within{outline:2px solid var(--olive);outline-offset:2px}

/* ---------- live badge: who is at an activity right now ---------- */
.av-live{position:relative;display:inline-grid;flex:none;width:var(--s);height:var(--s)}
.av-badge{position:absolute;right:-3px;bottom:-3px;width:max(16px,calc(var(--s) * .42));height:max(16px,calc(var(--s) * .42));border-radius:50%;display:grid;place-items:center;background:var(--cc);color:#fff;box-shadow:0 0 0 2px var(--bg)}
.sheet .av-badge{box-shadow:0 0 0 2px var(--surface)}
.av-badge svg,.av-badge .fi{width:62%;height:62%;margin:0;color:#fff;stroke-width:2.2}
.ps-live{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:14.5px;color:var(--ink-2)}
.ps-live a{font-weight:600;color:var(--ink)}
.ps-live-dot{width:10px;height:10px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 25%,transparent);flex:none}

.inst-ring > .av-live > .av{box-shadow:0 0 0 2px var(--surface)}

/* ---------- "I'm here" check-in ---------- */
.checkin{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:14px 0 6px;border:1.5px solid var(--olive);border-radius:14px;background:color-mix(in srgb,var(--olive) 8%,var(--surface))}
.checkin > div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.checkin b{font-size:16px}
.checkin span{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.checkin .btn{flex:none}
.checkin.done{border-color:var(--line);background:var(--surface)}
.checkin.done > svg{width:26px;height:26px;color:var(--olive-text);flex:none}
.prow-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px}
.tag-here{display:inline-flex;align-items:center;gap:3px;background:var(--olive-soft);color:var(--olive-text)}
.tag-here svg{width:12px;height:12px}

/* ---------- bottom bar: floating pill ---------- */
body.nav-pill .nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(calc(100vw - 32px),420px);padding:0;border-radius:999px;background:color-mix(in srgb,var(--navbar) 94%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--navbar-edge);box-shadow:0 12px 30px rgba(0,0,0,.25)}
body.nav-pill .nav-lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.nav-pill .nav-in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;max-width:none;height:auto}
body.nav-pill .nav a,body.nav-pill .nav button.create{height:54px;border-radius:999px;color:rgba(255,255,255,.82);gap:0}
body.nav-pill .nav a svg{width:26px;height:26px}
body.nav-pill .nav a[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff}
body.nav-pill .nav .plus{width:40px;height:40px;margin:0}
body.nav-pill .nav a:focus-visible,body.nav-pill .nav button.create:focus-visible{outline:2px solid #5FE0E6;outline-offset:-2px}
.nav-av{position:relative;display:grid}
.nav-av .av{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.nav-dot{position:absolute;right:-2px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#FF3B4E;box-shadow:0 0 0 2px var(--navbar)}
@media (max-width:360px){body.nav-pill .nav a,body.nav-pill .nav button.create{height:50px}body.nav-pill .nav .plus{width:36px;height:36px}}

/* bottom bar colour: a darker tone of each screen's own colours */
:root{--navbar:color-mix(in srgb,var(--ink) 90%,var(--bg));--navbar-edge:rgba(255,255,255,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--navbar:color-mix(in srgb,var(--bg) 60%,#000);--navbar-edge:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--navbar:color-mix(in srgb,var(--bg) 60%,#000);--navbar-edge:rgba(255,255,255,.1)}

/* ---------- in-app camera for instants ---------- */
button.inst-more,button.inst-add,button.pro-inst{border:0;font:inherit;cursor:pointer}
.cam{position:fixed;inset:0;z-index:95;background:#000}
.cam-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.cam-video.mirror{transform:scaleX(-1)}
.cam-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer}
.cam-x svg{width:22px;height:22px}
.cam-bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 30px}
.cam-shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.22);cursor:pointer;transition:transform .12s ease,background .12s ease}
.cam-shutter:active{transform:scale(.92);background:#fff}
.cam-shutter:disabled{opacity:.4;cursor:default}
.cam-flip{justify-self:end;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer}
.cam-flip svg{width:26px;height:26px}
.cam-x:focus-visible,.cam-shutter:focus-visible,.cam-flip:focus-visible{outline:3px solid #5FE0E6;outline-offset:3px}
.cam-msg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);margin:0;text-align:center;color:#fff;font-size:16px;line-height:1.5}
body.cam-open{overflow:hidden}

/* ---------- someone's profile page (same layout as your own) ---------- */
.u-top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:6px 0}
.u-handle{text-align:center;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-note{margin:4px 0 10px;padding:10px 12px;border-radius:12px;background:var(--olive-soft);color:var(--olive-text);font-size:14px;font-weight:600;text-align:center}
.u-actions{flex-wrap:wrap}
.pro-ints .shared{font-weight:700;color:var(--olive-text)}

/* ---------- photo posts and the profile grid ---------- */
.ig-photo{width:100%;aspect-ratio:4/5;background:var(--surface-2);overflow:hidden}
.ig-photo img{width:100%;height:100%;object-fit:cover;display:block}
.post-photo{margin:8px 0;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/5}
.post-photo img{width:100%;height:100%;object-fit:cover;display:block}
.compose-photo .cp-prev{width:100%;max-height:300px;object-fit:cover;border-radius:12px;display:block;margin-bottom:8px}
.compose-photo .btn svg{width:18px;height:18px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:6px 0 4px}
.pgrid-i{aspect-ratio:1;border:0;padding:0;background:var(--surface-2);overflow:hidden;cursor:pointer;border-radius:4px}
.pgrid-i img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid-i:focus-visible{outline:2px solid var(--olive);outline-offset:1px}

/* ---------- changing an activity's time ---------- */
.moved-note{display:flex;align-items:center;gap:8px;margin:10px 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--copper) 12%,var(--surface));color:var(--ink);font-size:14px;font-weight:600}
.moved-note svg{width:18px;height:18px;color:var(--copper-text);flex:none}

/* ---------- feed: "You're all caught up" ---------- */
.caught{display:flex;flex-direction:column;align-items:center;gap:4px;margin:22px 0 14px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.caught-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--olive);color:var(--olive-text)}
.caught-ic svg{width:24px;height:24px}
.caught b{font-size:16px;margin-top:4px}
.caught > span:last-child{font-size:13.5px;color:var(--ink-3)}

.iv-hint{margin:0;padding:6px 16px 0;text-align:center;font-size:13px;color:rgba(255,255,255,.7)}
</style>

<script>
(() => {
  const el = document.getElementById('intro');
  if (!el) return;
  try {   // the tagline follows the visitor's language, like the rest of Gomma
    const v = localStorage.getItem('fyp-lang'), nl = String(navigator.language || '').toLowerCase();
    const lang = (v === 'tr' || v === 'en' || v === 'el') ? v : nl.startsWith('tr') ? 'tr' : nl.startsWith('el') ? 'el' : 'en';
    el.querySelector('.intro-tag').textContent = {en:'social space of Cyprus', tr:'Kıbrıs’ın sosyal alanı', el:'ο κοινωνικός χώρος της Κύπρου'}[lang];
  } catch (e) {}
  if (document.documentElement.classList.contains('no-intro')) { el.remove(); return; }
  const done = () => { if (el.isConnected) el.remove(); };
  el.addEventListener('animationend', e => { if (e.target === el) done(); });
  const skip = () => el.classList.add('skip');
  el.addEventListener('click', skip); el.addEventListener('touchstart', skip, {passive:true});
  addEventListener('keydown', skip, {once:true});
  setTimeout(done, 6000);   // safety net
})();
</script>

    const { data, error } = await sb.storage.from(bucket).createSignedUrls(paths.slice(i, i + 100), 60 * 60 * 24 * 7);
    if (error) { console.warn(error); return; }

  const people = want(Object.values(S.profiles).map(x => x && x.photo), PHOTO, 'avatars');
  const acts = want(Object.values(S.acts).map(x => x && x.photo), ACT_PHOTO, 'activity-photos');

  if (!people.length && !acts.length && !logos.length && !adImgs.length && !postImgs.length) return;

// Redraws the picture as a square JPEG. This also strips hidden details such as the GPS location.
async function photoBlob(file, cover){
  if (!file || !/^image\//.test(file.type || '')) throw new Error('not-image');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const sw = img.naturalWidth, sh = img.naturalHeight;
    if (!sw || !sh) throw new Error('not-image');
    const c = document.createElement('canvas'), g = c.getContext('2d');
    if (cover) {
      const k = Math.min(1, 1600 / Math.max(sw, sh));
      c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
    } else {
      const side = Math.min(sw, sh), out = Math.min(480, side);
      c.width = c.height = out;
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, out, out);
      g.drawImage(img, (sw - side) / 2, (sh - side) / 2, side, side, 0, 0, out, out);
    }
    return await new Promise((ok, bad) => c.toBlob(b => b ? ok(b) : bad(new Error('encode')), 'image/jpeg', cover ? 0.82 : 0.85));
  } finally { URL.revokeObjectURL(url); }
}

const CAM = {stream:null, facing:'environment', busy:false};

async function startCamera(){
  stopCamera();
  const r = camRoot(), v = r.querySelector('.cam-video'); if (!v) return;
  r.querySelector('.cam-msg').hidden = true; r.querySelector('.cam-shutter').disabled = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camMsg(t('Your browser can’t open the camera. Try Safari or Chrome on your phone.'));
  try {
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.facing, width:{ideal:1920}, height:{ideal:1920}}, audio:false});
    if (!document.body.classList.contains('cam-open')) { st.getTracks().forEach(x => x.stop()); return; }   // closed while starting
    CAM.stream = st; v.srcObject = st; v.classList.toggle('mirror', CAM.facing === 'user');
    try { await v.play(); } catch (e) {}
    r.querySelector('.cam-shutter').disabled = false;
  } catch (e) {
    camMsg(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? t('Gomma needs your camera to take an instant. Allow camera access in your browser settings, then try again.') : t('Couldn’t open the camera. Try again.'));
  }

function camMsg(text){ const r = camRoot(), m = r.querySelector('.cam-msg'); if (m) { m.textContent = text; m.hidden = false; } const sh = r.querySelector('.cam-shutter'); if (sh) sh.disabled = true; }
