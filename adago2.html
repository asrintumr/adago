<style>
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --surface-2: #EEF2F5;
  --ink: #12212E;
  --ink-2: #33404B;
  --muted: #4F5B66;
  --line: #DDE3E8;
  --line-2: #CFD8DF;
  --sea: #0A6C86;
  --pin: #0A6C86;
  --sea-ink: #0A5468;
  --sea-tint: #E3F1F5;
  --on-sea: #FFFFFF;
  --clay: #B54708;
  --clay-ink: #8A3505;
  --clay-tint: #FFF4EC;
  --clay-line: #F3CFB6;
  --sun: #F2C94C;
  --sun-ink: #4D3B00;
  --sun-tint: #FBF0CC;
  --leaf-tint: #E8F3EC;
  --chip-on: #12212E;
  --chip-on-ink: #FFFFFF;
  --focus: #0A6C86;
  --display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --text: Inter, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A23; --surface: #172631; --surface-2: #1F313D; --ink: #EAF0F4; --ink-2: #CBD6DD; --muted: #A3B1BB;
    --line: #2A3D4A; --line-2: #375062; --sea: #5CB8D1; --sea-ink: #9AD5E5; --sea-tint: #16343F; --on-sea: #0B1A21;
    --clay: #F0A06C; --clay-ink: #F5BB93; --clay-tint: #2E2019; --clay-line: #4E3324; --sun: #F2C94C; --sun-ink: #F7DD8A; --sun-tint: #322A12;
    --leaf-tint: #1A2E24; --pin: #1A8BA8; --chip-on: #EAF0F4; --chip-on-ink: #0F1A23; --focus: #5CB8D1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A23; --surface: #172631; --surface-2: #1F313D; --ink: #EAF0F4; --ink-2: #CBD6DD; --muted: #A3B1BB;
  --line: #2A3D4A; --line-2: #375062; --sea: #5CB8D1; --sea-ink: #9AD5E5; --sea-tint: #16343F; --on-sea: #0B1A21;
  --clay: #F0A06C; --clay-ink: #F5BB93; --clay-tint: #2E2019; --clay-line: #4E3324; --sun: #F2C94C; --sun-ink: #F7DD8A; --sun-tint: #322A12;
  --leaf-tint: #1A2E24; --pin: #1A8BA8; --chip-on: #EAF0F4; --chip-on-ink: #0F1A23; --focus: #5CB8D1; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--sea); }
a:hover { color: var(--sea-ink); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
img, svg { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
.logo { display: flex; align-items: center; gap: 6px; color: var(--sea); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.logo span { font-family: var(--display); font-size: 25px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
.top-nav { display: none; gap: 4px; margin-left: 20px; }
.top-nav button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-weight: 600; font-size: 15px; cursor: pointer; }
.top-nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 17px; cursor: pointer; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--surface-2); }
.seg button { min-width: 46px; min-height: 38px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 700; }

/* layout */
main { max-width: 1120px; margin: 0 auto; padding: 8px 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 28px; }
.view-head { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }
h1 { margin: 0; font-family: var(--display); font-size: clamp(30px, 6vw, 46px); line-height: 1.05; letter-spacing: -0.025em; font-weight: 700; max-width: 18ch; }
h2 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.2; letter-spacing: -0.015em; font-weight: 700; }
h3 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; }
.lede { margin: 0; color: var(--muted); font-size: 17px; max-width: 58ch; }
.small { font-size: 13px; color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: var(--sea); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; }
.uni { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--sea-tint); color: var(--sea-ink); font-size: 14px; font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.pad { padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { color: var(--ink); border-color: var(--muted); }
.btn.primary { background: var(--sea); border-color: var(--sea); color: var(--on-sea); }
.btn.primary:hover { color: var(--on-sea); filter: brightness(1.06); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: #12212E; }
.btn.sun:hover { color: #12212E; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns > * { flex: 1 1 150px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--sea-tint); color: var(--sea-ink); }
.pill.dark { background: var(--chip-on); color: var(--chip-on-ink); }
.pill.sun { background: var(--sun-tint); color: var(--sun-ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-ink); }

/* hero band on home */
.hero { position: relative; overflow: hidden; border-radius: 24px; background: var(--sea); color: var(--on-sea); padding: 26px 22px 24px; display: flex; flex-direction: column; gap: 10px; }
.hero h1 { color: var(--on-sea); }
.hero p { margin: 0; max-width: 46ch; font-size: 17px; opacity: .92; }
.hero .uni { background: rgba(255,255,255,.16); color: var(--on-sea); }
.hero svg.waves { position: absolute; right: -40px; bottom: -30px; width: 300px; opacity: .22; pointer-events: none; }

/* lists */
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; text-decoration: none; min-height: 64px; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: var(--surface-2); color: var(--ink); }
.row .ico { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px; background: var(--sea-tint); color: var(--sea); }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-weight: 600; }
.row .s { font-size: 14px; color: var(--muted); }
.row .chev { color: var(--muted); flex-shrink: 0; }
.rail { display: flex; gap: 12px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 8px; scroll-snap-type: x mandatory; }
.rail > * { scroll-snap-align: start; }
.week { flex: 0 0 240px; display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: left; cursor: pointer; color: var(--ink); }
.week .when { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.15; }
.week:hover { border-color: var(--line-2); }

.place { display: flex; gap: 14px; width: 100%; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; cursor: pointer; color: var(--ink); }
.place:hover { border-color: var(--line-2); }
.place .mark { flex-shrink: 0; width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--ink-2); }
.place .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.place .name { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 16px; }
.place .meta { font-size: 14px; color: var(--muted); }
.places { display: grid; grid-template-columns: 1fr; gap: 10px; }
.t-cafe { background: var(--sea-tint); } .t-bar { background: var(--clay-tint); } .t-act { background: var(--surface-2); } .t-sport { background: var(--leaf-tint); } .t-taxi { background: var(--sun-tint); }

.featured { display: grid; gap: 10px; padding: 20px; border-radius: 20px; background: var(--ink); color: var(--bg); text-align: left; border: 0; cursor: pointer; }
.featured .pill { background: var(--bg); color: var(--ink); justify-self: start; }
.featured .fname { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.1; }
.featured .fmeta { opacity: .8; font-size: 15px; }

/* detail */
.facts { display: flex; flex-direction: column; }
.fact { display: flex; justify-content: space-between; gap: 16px; padding: 13px 16px; font-size: 15px; }
.fact + .fact { border-top: 1px solid var(--line); }
.fact dt { color: var(--muted); flex-shrink: 0; }
.fact dd { margin: 0; font-weight: 600; text-align: right; }
.note { padding: 16px; border-radius: 16px; background: var(--clay-tint); border: 1px solid var(--clay-line); color: var(--clay-ink); display: flex; flex-direction: column; gap: 6px; }
.note p { margin: 0; color: var(--ink-2); }
.why { padding: 16px; border-radius: 16px; background: var(--sea-tint); }
.why p { margin: 4px 0 0; }

/* checklist */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--sea); }
.check { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; cursor: pointer; }
.check + .check { border-top: 1px solid var(--line); }
.check input { flex-shrink: 0; width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--sea); cursor: pointer; }
.check .t { font-weight: 600; }
.check.done .t { text-decoration: line-through; color: var(--muted); }
.check .s { font-size: 14px; color: var(--muted); }

/* forms */
form { display: flex; flex-direction: column; gap: 14px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; }
.f input, .f select { min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; }
.ok { padding: 14px 16px; border-radius: 14px; background: var(--sea-tint); color: var(--sea-ink); font-weight: 600; }

/* route */
.fromto { display: flex; flex-direction: column; gap: 8px; }
.ft { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 12px; background: var(--surface-2); }
.ft .k { color: var(--muted); font-size: 14px; width: 48px; flex-shrink: 0; }
.ft .v { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 999px; background: var(--sea); box-shadow: 0 0 0 3px var(--sea-tint); flex-shrink: 0; }
.opt { border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.opt.open { border-color: var(--sea); }
.opt-head { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 16px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.opt-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.opt-time { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; }
.opt-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mode { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; }
.mode.walk { background: var(--surface-2); color: var(--ink-2); }
.mode.car { background: var(--chip-on); color: var(--chip-on-ink); }
.mode.taxi { background: var(--sun); color: #12212E; }
.steps { list-style: none; margin: 0; padding: 4px 16px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
.steps li { display: flex; gap: 12px; padding-top: 12px; }
.steps .sd { flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.steps .st { font-weight: 700; }
.steps .ss { font-size: 14px; color: var(--muted); }
.steps .sx { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px; background: var(--clay-tint); color: var(--clay-ink); font-size: 13px; font-weight: 600; }
.opt-foot { padding: 0 16px 16px; }

/* footer + tabbar */
footer { max-width: 1120px; margin: 0 auto; padding: 0 20px calc(110px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 13px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; }
.tabbar button[aria-current="page"] { color: var(--sea); font-weight: 700; }

@media (min-width: 760px) {
  .grid2 { grid-template-columns: 1fr 1fr; align-items: start; }
  .places { grid-template-columns: 1fr 1fr; }
  .hero { padding: 40px 36px 36px; }
}
@media (min-width: 960px) {
  .top-nav { display: flex; }
  .tabbar { display: none; }
  main { padding-bottom: 48px; }
  footer { padding-bottom: 40px; }
  .places { grid-template-columns: 1fr 1fr 1fr; }
  .narrow { max-width: 720px; }
}
</style>

/* routing: plain #tokens like #discover, #place-tatli, #route-tatli */
function fromHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (VIEWS.includes(h) || h === 'help') return { view: h, place: null };
  const m = h.match(/^(place|route)-([a-z0-9]+)$/);
  if (m && byId(m[2])) return { view: m[1], place: m[2] };
  return { view: 'home', place: null };
}
function go(view, place) {
  st.view = view; st.place = place || null;
  if (view === 'route') { st.rtab = 'all'; st.ropen = null; if (st.origin === 'me' && !(st.loc && typeof st.loc === 'object')) locate(); }
  render();
  window.scrollTo(0, 0);
  const app = document.getElementById('app'); if (app) app.focus({ preventScroll: true });
}

/* geolocation */
function locate() {
  if (!('geolocation' in navigator)) { st.loc = 'err'; render(); return; }
  st.loc = 'wait';
  navigator.geolocation.getCurrentPosition(
    (p) => { st.loc = { lat: p.coords.latitude, lng: p.coords.longitude }; if (st.view === 'route') render(); },
    () => { st.loc = 'err'; if (st.view === 'route') render(); },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
  );
}

/* distance + estimates */
function hav(a, b) {
  const r = (v) => v * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function est(from, p) {
  const d = hav(from, p);
  const wk = Math.max(d * 1.2, 0.2), dk = Math.max(d * 1.28, 0.5);
  return { wk, dk, wm: Math.max(3, Math.round(wk / 4.8 * 60)), dm: Math.max(3, Math.round(dk / 24 * 60)) };
}
const kmS = (v) => { const s = (Math.round(v * 10) / 10).toFixed(1); return st.lang === 'tr' ? s.replace('.', ',') : s; };
const clock = (m) => { const d = new Date(Date.now() + m * 60000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function gmapsDir(p, mode) {
  let u = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(p.n[0] + ', Gazimağusa') + '&destination_place_id=' + p.pid + '&travelmode=' + mode;
  if (st.origin === 'emu') u += '&origin=' + EMU.lat + ',' + EMU.lng;
  return u;
}
const gmapsPlace = (p) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.n[0] + ', Gazimağusa') + '&query_place_id=' + p.pid;

function plan(p) {
  let from = null, status = '';
  if (st.origin === 'emu') from = EMU;
  else if (st.loc && typeof st.loc === 'object') from = st.loc;
  else status = st.loc === 'err' ? 'err' : 'wait';
  if (from && hav(from, p) > 50) { from = null; status = 'far'; }
  if (!from) return { ready: false, status };
  const e = est(from, p);
  const opts = [
    { id: 'taxi', mins: e.dm + 6, km: e.dk },
    { id: 'car', mins: e.dm, km: e.dk },
    { id: 'walk', mins: e.wm, km: e.wk }
  ];
  const rec = e.wm <= 15 ? 'walk' : 'taxi';
  let fast = 'walk'; for (const id of ['walk', 'car', 'taxi']) { if (opts.find((o) => o.id === id).mins < opts.find((o) => o.id === fast).mins) fast = id; }
  const rank = (o) => (o.id === rec ? 0 : o.id === fast ? 1 : 2 + ['taxi', 'car', 'walk'].indexOf(o.id));
  return { ready: true, e, opts: opts.slice().sort((a, b) => rank(a) - rank(b)), rec, fast };
}

function vRoute() {
  const t = T(), p = byId(st.place); if (!p || !p.lat) return vDiscover();
  const pl = plan(p);
  const origins = [['me', t.meBtn], ['emu', t.emuBtn]].map((o) => `<button class="chip" style="flex:1" aria-pressed="${st.origin === o[0]}" data-act="origin:${o[0]}">${esc(o[1])}</button>`).join('');
  let body = '';
  if (!pl.ready) {
    const msg = pl.status === 'err' ? t.sErr : pl.status === 'far' ? t.sFar : t.sWait;
    body = `<div class="card pad stack"><p role="status" style="margin:0">${esc(msg)}</p>
      ${pl.status !== 'wait' ? `<div class="btns"><button class="btn primary" data-act="origin:emu">${esc(t.useEmu)}</button>${pl.status === 'err' ? `<button class="btn" data-act="retry">${esc(t.retry)}</button>` : ''}</div>` : ''}</div>`;
  } else {
    const e = pl.e;
    const tabs = ['all', 'taxi', 'car', 'walk'].map((k) => {
      const o = pl.opts.find((q) => q.id === k);
      return `<button class="chip" aria-pressed="${st.rtab === k}" data-act="rtab:${k}">${esc(t.tabs[k])} <span style="font-weight:500">${esc(o ? o.mins + t.min : t.three)}</span></button>`;
    }).join('');
    const vis = st.rtab === 'all' ? pl.opts : pl.opts.filter((o) => o.id === st.rtab);
    const openId = st.ropen && vis.some((o) => o.id === st.ropen) ? st.ropen : vis[0].id;
    const stepsFor = (id) => {
      const arrive = { title: t.arriveAt + nm(p), sub: p.address, x: '' };
      if (id === 'taxi') return [{ title: st.origin === 'emu' ? t.taxiEmu : t.taxiMe, sub: t.wait, x: '' }, { title: t.ride, sub: kmS(e.dk) + t.about2 + e.dm + t.min, x: t.askPrice }, arrive];
      if (id === 'car') return [{ title: t.drive, sub: kmS(e.dk) + t.about2 + e.dm + t.min, x: t.park }, arrive];
      return [{ title: t.walk, sub: kmS(e.wk) + t.about2 + e.wm + t.min, x: e.wm > 20 ? t.water : '' }, arrive];
    };
    const dotStyle = { taxi: 'background:var(--sun);color:#12212E', car: 'background:var(--chip-on);color:var(--chip-on-ink)', walk: 'background:var(--surface-2);color:var(--ink-2)' };
    const opts = vis.map((o) => {
      const open = o.id === openId;
      const tags = (o.id === pl.rec ? `<span class="pill">${esc(t.rec)}</span>` : '') + (o.id === pl.fast ? `<span class="pill dark">${esc(t.fast)}</span>` : '');
      const icon = o.id === 'walk' ? I.walk : I.car;
      const steps = open ? `<ol class="steps">${stepsFor(o.id).map((s) => `<li><span class="sd" style="${dotStyle[o.id]}">${icon}</span><span><span class="st">${esc(s.title)}</span><br><span class="ss">${esc(s.sub)}</span>${s.x ? `<br><span class="sx">${esc(s.x)}</span>` : ''}</span></li>`).join('')}</ol>
        <div class="opt-foot btns">
          ${o.id === 'taxi' ? `<button class="btn sun" data-go="transport" data-anchor="taxis">${I.phone}${esc(t.callTaxi)}</button>` : ''}
          <a class="btn" href="${gmapsDir(p, o.id === 'walk' ? 'walking' : 'driving')}" target="_blank" rel="noopener">${I.map}${esc(t.startMaps)}</a>
        </div>` : '';
      return `<div class="opt ${open ? 'open' : ''}">
        <button class="opt-head" aria-expanded="${open}" data-act="ropen:${o.id}">
          <span class="opt-top"><span class="opt-tags"><span class="opt-time">${o.mins}${esc(t.min)}</span>${tags}</span><span class="small" style="font-size:14px">${esc(t.arrive + clock(o.mins))}</span></span>
          <span><span class="mode ${o.id}">${icon}${esc(t.tabs[o.id])} · ${esc(kmS(o.km))} km</span></span>
        </button>${steps}</div>`;
    }).join('');
    body = `<div class="chips" role="tablist">${tabs}</div><div class="stack">${opts}</div><p class="small">${esc(t.est)}</p>`;
  }
  return `<div class="view narrow">
    <div>${backBtn('place:' + p.id)}</div>
    <div class="view-head" style="padding-top:0"><h1>${esc(t.rT)}</h1></div>
    <section class="card pad stack">
      <div class="fromto">
        <div class="ft"><span class="dot" aria-hidden="true"></span><span class="k">${esc(t.from)}</span><span class="v">${esc(st.origin === 'emu' ? t.emu : t.me)}</span></div>
        <div class="ft"><span style="color:var(--clay);display:flex">${I.pin(14)}</span><span class="k">${esc(t.to)}</span><span class="v">${esc(nm(p))}</span></div>
      </div>

    </section>

  </div>`;
}

}

/* events */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) {
    e.preventDefault();
    const [view, id] = g.getAttribute('data-go').split(':');
    go(view, id);
    const anchor = g.getAttribute('data-anchor');
    if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ block: 'start' }); }
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const [act, val] = a.getAttribute('data-act').split(':');
  if (act === 'lang') { st.lang = val; store.set('landed-lang', val); render(); }
  else if (act === 'cat') { st.cat = val; render(); }
  else if (act === 'htab') { st.htab = val; st.sent = false; render(); }
  else if (act === 'origin') { st.origin = val; st.ropen = null; if (val === 'me' && !(st.loc && typeof st.loc === 'object')) locate(); render(); }
  else if (act === 'retry') { locate(); render(); }
  else if (act === 'rtab') { st.rtab = val; st.ropen = null; render(); }
  else if (act === 'ropen') { st.ropen = val; render(); }
});
document.addEventListener('change', (e) => {
  const k = e.target.getAttribute && e.target.getAttribute('data-tick');
  if (!k) return;
  st.ticks[k] = e.target.checked; store.set('landed-arrival', st.ticks); render();
  const el = document.querySelector(`[data-tick="${k}"]`); if (el) el.focus();
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'tq') return;
  st.q = e.target.value;
  document.getElementById('tlist').innerHTML = transportList(st.q.trim().toLocaleLowerCase(st.lang));
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  if (!CONTACT_WHATSAPP) return;
  const d = Object.fromEntries(new FormData(f).entries());
  const text = f.getAttribute('data-form') === 'owner' ? T().waOwner(d) : T().waStudent(d);
  window.open('https://wa.me/' + CONTACT_WHATSAPP + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  st.sent = true; render();
});
window.addEventListener('scroll', () => { document.getElementById('top').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
window.addEventListener('hashchange', () => { const h = fromHash(); go(h.view, h.place); });

const start = fromHash();
st.view = start.view; st.place = start.place;
if (st.view === 'route' && st.origin === 'me') locate();
render();

</script>
</body>
</html>
